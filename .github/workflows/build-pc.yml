name: Build Windows App (Native JVM)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle (Version 8.8 stable)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Compiler le projet avec Gradle
        shell: pwsh
        run: |
          gradle createDistribution

      - name: Préparer l'archive finale
        shell: pwsh
        run: |
          Compress-Archive -Path "build/compose/binaries/main/msi/*" -DestinationPath "PS5PkgMerger-Windows.zip" -Force

      - name: Sauvegarder l'artefact Windows
        uses: actions/upload-artifact@v4
        with:
          name: ps5pkg-merger-windows
          path: PS5PkgMerger-Windows.zip
