name: Build Desktop App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Générer le wrapper Gradle à la volée
      shell: pwsh
      run: gradle wrapper

    - name: 🛠️ Compiler la version bureau (Desktop)
      shell: pwsh
      run: |
        # Utilise le gradlew fraîchement généré
        ./gradlew.bat clean assembleDebug --info

    - name: 📤 Sauvegarder les artefacts
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Output
        path: app/build/outputs/apk/debug/*.apk
