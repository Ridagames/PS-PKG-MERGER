name: Build Desktop App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐘 Configurer Gradle (Version 8.4)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 🛠️ Compiler l'application
      shell: pwsh
      run: |
        # Utilise directement le gradlew généré ou la commande gradle avec la version 8.4 épinglée
        gradlew clean assembleDebug --info

    - name: 📤 Sauvegarder les artefacts
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Output
        path: app/build/outputs/apk/debug/*.apk
