name: Build Windows App (Gradle 8.4)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-kotlin:
    runs-on: windows-latest

    steps:
    - name: 📥 Récupérer le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java JDK (nécessaire pour Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐘 Configurer Gradle (Version 8.4)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 🛠️ Compiler l'application pour Windows (Desktop)
      shell: pwsh
      run: |
        # Lance la compilation de la version bureau (Desktop)
        ./gradlew.bat clean createDistribution --info

    - name: 📤 Sauvegarder les artefacts (Exécutable Windows)
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Windows-Output
        path: app/build/compose/binaries/main/msi/*.msi # ou l'équivalent .exe / dossier zippé selon ta conf Compose Desktop

