name: Build Windows App (Native JVM)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle (Version 8.8 stable)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Lister les tâches disponibles pour comprendre le projet
        shell: pwsh
        run: |
          gradle tasks --all

      - name: Compiler le projet
        shell: pwsh
        run: |
          gradle build
