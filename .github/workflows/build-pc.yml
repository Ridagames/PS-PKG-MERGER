name: Build PC App (Windows, Linux, macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances graphiques (Tkinter / PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compiler l'application pour Windows (.exe avec interface native)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --name "PS-PKG-Freedom-Hub-PC" main.py

      - name: Compiler l'application pour Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconsole --onefile --name "PS-PKG-Freedom-Hub-Linux" main.py

      - name: Compiler l'application pour macOS
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --onefile --name "PS-PKG-Freedom-Hub-Mac" main.py

      - name: Sauvegarder l'artefact Windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-hub-windows
          path: dist/PS-PKG-Freedom-Hub-PC.exe

      - name: Sauvegarder l'artefact Linux
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-hub-linux
          path: dist/PS-PKG-Freedom-Hub-Linux

      - name: Sauvegarder l'artefact macOS
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-hub-mac
          path: dist/PS-PKG-Freedom-Hub-Mac
