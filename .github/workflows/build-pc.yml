name: Build Windows App (Auto Wrapper)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-kotlin:
    runs-on: windows-latest

    steps:
    - name: 📥 Récupérer le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java JDK (nécessaire pour Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐘 Configurer Gradle (Version 8.4)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 🛠️ Générer le wrapper Gradle et compiler l'application
      shell: pwsh
      run: |
        # Génère les fichiers gradlew manquants à la volée
        gradle wrapper --gradle-version 8.4
        
        # Lance la compilation avec le wrapper fraîchement créé
        ./gradlew.bat assembleDebug --info

    - name: 📤 Sauvegarder les artefacts
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Windows-Output
        path: app/build/outputs/apk/debug/*.apk
