name: Build PC Desktop App

on:
  push:
    branches: [ main, master ]

jobs:
  build-pc:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐘 Configurer Gradle (Version 8.4)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 🛠️ Compiler l'application Windows (EXE)
      shell: pwsh
      run: gradle :desktop:packageDistributionForCurrentOs --info

    - name: 📤 Sauvegarder l'exécutable PC
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Windows-App
        path: desktop/build/compose/binaries/main/exe/*.exe
