name: Build Windows App (Compose Multiplatform Kotlin)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-kotlin:
    runs-on: windows-latest

    steps:
    - name: 📥 Récupérer le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java JDK (nécessaire pour Gradle / Kotlin)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🛠️ Compiler l'application Desktop via Gradle (Compose Multiplatform)
      shell: pwsh
      run: |
        # Lancement de la tâche Gradle pour empaqueter l'application Desktop pour Windows
        # Selon ton fichier build.gradle.kts, la tâche s'appelle souvent packageDistributionForCurrentOS ou createDistribution
        if (Test-Path "./gradlew.bat") {
            ./gradlew.bat packageDistributionForCurrentOS --info
        } else {
            gradle packageDistributionForCurrentOS --info
        }

    - name: 📦 Archiver et préparer les artefacts Windows
      shell: pwsh
      run: |
        $targetDir = "build/compose/binaries/main/msi"
        if (-not (Test-Path $targetDir)) {
            $targetDir = "build/compose/binaries/main"
        }
        
        New-Item -ItemType Directory -Force -Path "./publish_windows"
        if (Test-Path $targetDir) {
            Copy-Item -Path "$targetDir/*" -Destination "./publish_windows" -Recurse -Force
        }

        # Compression du tout dans un ZIP
        Compress-Archive -Path ./publish_windows/* -DestinationPath ./PS5-PKG-Merger-Kotlin-Windows.zip -Force

    - name: 📤 Sauvegarder dans les artefacts GitHub
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Kotlin-Windows
        path: ./PS5-PKG-Merger-Kotlin-Windows.zip
