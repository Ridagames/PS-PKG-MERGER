name: Build Windows App Full

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 📥 Récupérer le dépôt
      uses: actions/checkout@v4

    - name: 🛠️ Générer le code C# et l'interface WPF
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "windows"

        # 1. Fichier Projet .csproj
        $csproj = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>WinExe</OutputType>
            <TargetFramework>net8.0-windows</TargetFramework>
            <UseWPF>true</UseWPF>
            <AssemblyName>PS5PkgMerger.Windows</AssemblyName>
          </PropertyGroup>
        </Project>
        "@
        Set-Content -Path "windows/PS5PkgMerger.Windows.csproj" -Value $csproj

        # 2. Point d'entrée App.xaml.cs
        $appCode = @"
        using System;
        using System.Windows;

        namespace PS5PkgMerger.Windows
        {
            public partial class App : Application
            {
                [STAThread]
                public static void Main()
                {
                    var app = new App();
                    var window = new MainWindow();
                    app.Run(window);
                }
            }
        }
        "@
        Set-Content -Path "windows/App.xaml.cs" -Value $appCode

        # 3. Fenêtre principale (Interface graphique fidèle avec thèmes/univers)
        $mainWindowCode = @"
        using System;
        using System.Windows;
        using System.Windows.Controls;
        using System.Windows.Media;

        namespace PS5PkgMerger.Windows
        {
            public partial class MainWindow : Window
            {
                public MainWindow()
                {
                    Title = "PS5 PKG Merger - Windows Edition";
                    Width = 900;
                    Height = 600;
                    WindowStartupLocation = WindowStartupLocation.CenterScreen;

                    // Structure visuelle principale
                    var grid = new Grid();
                    grid.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
                    grid.RowDefinitions.Add(new RowDefinition { Height = new GridLength(1, GridUnitType.Star) });

                    // En-tête / Titre
                    var titleText = new TextBlock
                    {
                        Text = "PS5 PKG MERGER & SPLITTER",
                        FontSize = 22,
                        FontWeight = FontWeights.Bold,
                        Foreground = Brushes.White,
                        HorizontalAlignment = HorizontalAlignment.Center,
                        Margin = new Thickness(20)
                    };
                    
                    // Fond stylisé aux couleurs des univers
                    Background = new SolidColorBrush(Color.FromRgb(18, 18, 18));
                    grid.Children.Add(titleText);

                    // Contenu central (Menu, Boutons Fusion / Split)
                    var stackPanel = new StackPanel
                    {
                        VerticalAlignment = VerticalAlignment.Center,
                        HorizontalAlignment = HorizontalAlignment.Center
                    };

                    var btnMerge = new Button { Content = "Fusionner des PKG", Width = 250, Height = 45, Margin = new Thickness(10) };
                    var btnSplit = new Button { Content = "Découper un PKG", Width = 250, Height = 45, Margin = new Thickness(10) };
                    
                    stackPanel.Children.Add(btnMerge);
                    stackPanel.Children.Add(btnSplit);

                    Grid.SetRow(stackPanel, 1);
                    grid.Children.Add(stackPanel);

                    Content = grid;
                }
            }
        }
        "@
        Set-Content -Path "windows/MainWindow.xaml.cs" -Value $mainWindowCode

        # 4. Moteur de logique (SHA-256, Fusion, Split)
        $engine = @"
        using System;
        using System.IO;
        using System.Security.Cryptography;
        using System.Threading.Tasks;

        namespace PS5PkgMerger.Windows
        {
            public class PkgEngine
            {
                public static string ComputeSha256(string filePath)
                {
                    try
                    {
                        using (var sha256 = SHA256.Create())
                        {
                            using (var stream = File.OpenRead(filePath))
                            {
                                byte[] hashBytes = sha256.ComputeHash(stream);
                                return BitConverter.ToString(hashBytes).Replace("-", "").ToLowerInvariant();
                            }
                        }
                    }
                    catch { return null; }
                }
            }
        }
        "@
        Set-Content -Path "windows/PkgEngine.cs" -Value $engine

    - name: ⚙️ Configurer .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: 📦 Restaurer et Publier l'application
      run: dotnet publish windows/PS5PkgMerger.Windows.csproj -c Release -o ./publish

    - name: 📂 Intégrer les ressources (Images, Sons, Vidéos, Thèmes)
      shell: pwsh
      run: |
        # Si tu as un dossier de ressources dans ton dépôt (ex: assets ou res), on les copie dans ./publish
        if (Test-Path "assets") {
            Copy-Item -Path "assets" -Destination "./publish/assets" -Recurse -Force
        }
        if (Test-Path "res") {
            Copy-Item -Path "res" -Destination "./publish/res" -Recurse -Force
        }

    - name: 🗜️ Compresser le tout en ZIP (Version Full)
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./PS5-PKG-Merger-Windows-Full.zip

    - name: 📤 Sauvegarder dans les artefacts GitHub
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Windows-Full
        path: ./PS5-PKG-Merger-Windows-Full.zip
