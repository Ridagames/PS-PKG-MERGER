name: Build PC App (Windows, Linux, macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: PS5PkgMerger-Windows.zip
          - os: ubuntu-latest
            name: Linux
            artifact_name: PS5PkgMerger-Linux.tar.gz
          - os: macos-latest
            name: macOS
            artifact_name: PS5PkgMerger-Mac.dmg

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer PyInstaller et dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compiler l'application complète
        run: |
          pyinstaller --noconsole --onefile --name "PS5PkgMerger" main.py

      - name: Sauvegarder l'artefact Windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ps5pkg-merger-windows
          path: dist/PS5PkgMerger.exe

      - name: Sauvegarder l'artefact Linux
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ps5pkg-merger-linux
          path: dist/PS5PkgMerger

      - name: Sauvegarder l'artefact macOS
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ps5pkg-merger-mac
          path: dist/PS5PkgMerger
