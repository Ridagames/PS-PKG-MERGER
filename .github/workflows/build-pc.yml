name: Build PC App (Windows, Linux, macOS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: PkgHub-Windows.exe
          - os: ubuntu-latest
            name: Linux
            artifact_name: PkgHub-Linux.tar.gz
          - os: macos-latest
            name: macOS
            artifact_name: PkgHub-Mac.dmg

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer PyInstaller et dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compiler l'application (Windows & Linux)
        if: matrix.os != 'macos-latest'
        run: |
          pyinstaller --noconsole --onefile --name "PS-PKG-Freedom-Hub" main.py

      - name: Compiler l'application (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --onefile --windowed --name "PS-PKG-Freedom-Hub" main.py

      - name: Empaqueter pour Linux (.tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf PkgHub-Linux.tar.gz -C dist PS-PKG-Freedom-Hub

      - name: Empaqueter pour macOS (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil create -volname "PS PKG Freedom Hub" -srcfolder "dist/PS-PKG-Freedom-Hub.app" -ov PkgHub-Mac.dmg

      - name: Sauvegarder l'artefact Windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-hub-windows
          path: dist/PS-PKG-Freedom-Hub.exe

      - name: Sauvegarder l'artefact Linux
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-hub-linux
          path: PkgHub-Linux.tar.gz

      - name: Sauvegarder l'artefact macOS
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
          with:
          name: pkg-hub-mac
          path: PkgHub-Mac.dmg
