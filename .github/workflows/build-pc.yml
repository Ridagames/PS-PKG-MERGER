name: Build Windows App (Native JVM)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle (Version 8.8 stable)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Mettre de côté les fichiers récalcitrants pour la compilation Android
        shell: pwsh
        run: |
          # Crée un dossier temporaire et déplace les fichiers bloquants hors de 'res'
          New-Item -ItemType Directory -Force -Path "temp_assets"
          if (Test-Path "app/src/main/res/drawable/?fn_chest_closed.png") {
            Move-Item "app/src/main/res/drawable/?fn_chest_closed.png" "temp_assets/fn_chest_closed.png"
          }
          if (Test-Path "app/src/main/res/raw/?fn_bus.mp3") {
            Move-Item "app/src/main/res/raw/?fn_bus.mp3" "temp_assets/fn_bus.mp3"
          }

      - name: Compiler le projet
        shell: pwsh
        run: |
          gradle assembleRelease

      - name: Restaurer les fichiers pour l'application finale
        shell: pwsh
        run: |
          # Remet les fichiers propres dans le package final
          if (Test-Path "temp_assets/fn_chest_closed.png") {
            Move-Item "temp_assets/fn_chest_closed.png" "app/build/outputs/apk/release/" -Force
          }
          if (Test-Path "temp_assets/fn_bus.mp3") {
            Move-Item "temp_assets/fn_bus.mp3" "app/build/outputs/apk/release/" -Force
          }

      - name: Préparer l'archive finale
        shell: pwsh
        run: |
          Compress-Archive -Path "app/build/outputs/apk/release/*" -DestinationPath "PS5PkgMerger-Windows.zip" -Force

      - name: Sauvegarder l'artefact Windows
        uses: actions/upload-artifact@v4
        with:
          name: ps5pkg-merger-windows
          path: PS5PkgMerger-Windows.zip
