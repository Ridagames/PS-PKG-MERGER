name: Build Windows App (Gradle 8.4)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-kotlin:
    runs-on: windows-latest

    steps:
    - name: 📥 Récupérer le dépôt
      uses: actions/checkout@v4

    - name: ☕ Configurer Java JDK (nécessaire pour Gradle)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐘 Configurer Gradle (Version 8.4 exacte)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 🛠️ Compiler l'application avec Gradle
      shell: pwsh
      run: ./gradlew assembleDebug --info

    - name: 📤 Sauvegarder les artefacts
      uses: actions/upload-artifact@v4
      with:
        name: PS5-PKG-Merger-Windows-Output
        path: app/build/outputs/apk/debug/*.apk
