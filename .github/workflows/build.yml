              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              @SuppressLint("ClickableViewAccessibility")
              private fun createCustomButton(labelText: String, bgHex: String, borderHexStr: String, treeSide: Int, onClickAction: () -> Unit): View {
                  val cfg = getThemeConfig(currentTheme)
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(4), 0, dp(4))
                  }
                  val buttonContent = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  val normalBg = GradientDrawable().apply {
                      setColor(Color.parseColor(bgHex))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(2), Color.parseColor(borderHexStr))
                  }
                  val pressedBg = GradientDrawable().apply {
                      setColor(Color.parseColor(cfg.pressColor))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(3), Color.WHITE)
                  }
                  buttonContent.background = normalBg
                  val tv = TextView(this).apply {
                      text = labelText
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  buttonContent.addView(tv, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))
                  container.addView(buttonContent, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                  buttonContent.setOnClickListener {
                      val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      vibrator?.vibrate(VibrationEffect.createOneShot(120, VibrationEffect.DEFAULT_AMPLITUDE))
                      onClickAction()
                  }
                  buttonContent.setOnTouchListener { view, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> { view.animate().scaleX(0.96f).scaleY(0.96f).setDuration(60).start(); view.background = pressedBg }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { view.animate().scaleX(1.0f).scaleY(1.0f).setDuration(80).start(); view.background = normalBg }
                      }
                      false
                  }
                  return container
              }

              private fun setupBackgroundMedia() {
                  try {
                      bgVideoView?.stopPlayback()
                      bgVideoView?.visibility = View.GONE
                      try { musicPlayer?.stop() } catch (_: Exception) {}
                      musicPlayer?.release()
                      musicPlayer = null

                      if (currentTheme == "GOW" || currentTheme == "FORTNITE") {
                          bgVideoView?.visibility = View.VISIBLE
                          val videoName = if (currentTheme == "GOW") "gow_bg" else "fn_bg"
                          val videoResId = resources.getIdentifier(videoName, "raw", packageName)
                          if (videoResId != 0 && bgVideoView != null) {
                              val uri = Uri.parse("android.resource://$packageName/$videoResId")
                              bgVideoView?.setVideoURI(uri)
                              bgVideoView?.setOnPreparedListener { mp ->
                                  mp.isLooping = true
                                  mp.setVolume(0f, 0f)
                                  bgVideoView?.setVideoSize(mp.videoWidth, mp.videoHeight)
                                  bgVideoView?.start()
                              }
                          }
                          val musicName = if (currentTheme == "GOW") "gow_music" else "fn_music"
                          val musicResId = resources.getIdentifier(musicName, "raw", packageName)
                          if (musicResId != 0) {
                              musicPlayer = MediaPlayer.create(this, musicResId)
                              musicPlayer?.isLooping = true
                              musicPlayer?.start()
                          }
                      }
                  } catch (_: Exception) {}
              }

              override fun onResume() { super.onResume(); setupBackgroundMedia() }
              override fun onPause() { super.onPause(); bgVideoView?.pause(); try { musicPlayer?.pause() } catch (_: Exception) {} }
              override fun onDestroy() { super.onDestroy(); try { musicPlayer?.release() } catch (_: Exception) {} clickPlayer?.release() }

