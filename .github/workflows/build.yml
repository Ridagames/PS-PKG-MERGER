                  rebuildButtons()
                  menuBtn.background = GradientDrawable().apply {
                      setColor(Color.parseColor(cfg.btnRev.first))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(2), Color.parseColor(cfg.btnRev.second))
                  }
