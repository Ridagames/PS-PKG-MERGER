              private fun showCustomMenu(anchor: View) {
                  if (processing) {
                      toast("⚠️ Traitement en cours !")
                      return
                  }
                  val cfg = getThemeConfig(currentTheme)
                  
                  val dialogView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = GradientDrawable().apply {
                          setColor(cfg.card)
                          cornerRadius = dp(10).toFloat()
                          setStroke(dp(2), Color.parseColor(cfg.border))
                      }
                  }

                  val titleMenu = TextView(this).apply {
                      text = "⚙️ OPTIONS & MENU"
                      textSize = 14f
                      setTextColor(cfg.primaryText)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 0, dp(12))
                  }
                  dialogView.addView(titleMenu)

                  fun addMenuOption(text: String, action: () -> Unit) {
                      val btn = Button(this).apply {
                          this.text = text
                          setTextColor(Color.WHITE)
                          textSize = 12f
                          gravity = Gravity.START or Gravity.CENTER_VERTICAL
                          setBackgroundColor(Color.TRANSPARENT)
                          setOnClickListener {
                              action()
                          }
                      }
                      dialogView.addView(btn, LinearLayout.LayoutParams(MATCH_PARENT, dp(40)))
                  }

                  val dialog = AlertDialog.Builder(this)
                      .setView(dialogView)
                      .create()

                  dialog.window?.setBackgroundDrawableResource(android.R.color.transparent)

                  addMenuOption(if (appMode == "MERGE") "📂 Basculer en Mode Splitter" else "🔗 Basculer en Mode Fusion") {
                      dialog.dismiss()
                      appMode = if (appMode == "MERGE") "SPLIT" else "MERGE"
                      if (appMode == "SPLIT") {
                          titleView.text = "⚡ PKG SPLITTER"
                          section1Title.text = "1. FICHIER SOURCE UNIQUE (.PKG)"
                          statusView.text = "Prêt à découper."
                      } else {
                          titleView.text = tr("app_title")
                          section1Title.text = tr("sec1")
                          statusView.text = tr("status_ready")
                      }
                      output = null
                      outView.text = tr("out_lbl")
                      rebuildButtons()
                  }

                  addMenuOption("🎨 Changer d'Univers") {
                      dialog.dismiss()
                      showThemeDialog()
                  }

                  addMenuOption("🌐 Changer la Langue / Language") {
                      dialog.dismiss()
                      showLanguageDialog()
                  }

                  addMenuOption("🔄 Vérifier les mises à jour") {
                      dialog.dismiss()
                      checkForUpdates()
                  }

                  addMenuOption("ℹ️ À propos (v2.9.50)") {
                      dialog.dismiss()
                      toast("PS PKG Freedom Hub v2.9.50")
                  }

                  dialog.show()
              }

              private fun checkForUpdates() {
                  toast("🔍 Recherche de mises à jour...")
                  Thread {
                      try {
                          val repoUrl = "https://api.github.com/repos/ton-pseudo/ton-repo/releases/latest"
                          val url = URL(repoUrl)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("User-Agent", "PkgMerger-App")
                          conn.connectTimeout = 5000

                          if (conn.responseCode == 200) {
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val tagMatch = Regex("\"tag_name\"\\s*:\\s*\"([^\"]+)\"").find(response)
                              val apkUrlMatch = Regex("\"browser_download_url\"\\s*:\\s*\"([^\"]+\\.apk)\"").find(response)

                              if (tagMatch != null && apkUrlMatch != null) {
                                  val latestTag = tagMatch.groupValues[1].replace("v", "")
                                  val apkUrl = apkUrlMatch.groupValues[1]
                                  val currentVersion = "2.1.0"

                                  ui.post {
                                      if (isVersionNewer(latestTag, currentVersion)) {
                                          showUpdateDialog(latestTag, apkUrl)
                                      } else {
                                          toast("✅ Ton application est déjà à jour (v$currentVersion) !")
                                      }
                                  }
                              } else {
                                  ui.post { toast("⚠️ Aucun fichier APK trouvé dans la dernière release.") }
                              }
                          } else {
                              ui.post { toast("❌ Erreur de connexion au serveur GitHub.") }
                          }
                      } catch (e: Exception) {
                          ui.post { toast("❌ Échec de la vérification : ${e.message}") }
                      }
                  }.start()
              }

              private fun isVersionNewer(remote: String, local: String): Boolean {
                  try {
                      val rParts = remote.split(".").map { it.toIntOrNull() ?: 0 }
                      val lParts = local.split(".").map { it.toIntOrNull() ?: 0 }
                      for (i in 0 until maxOf(rParts.size, lParts.size)) {
                          val r = rParts.getOrNull(i) ?: 0
                          val l = lParts.getOrNull(i) ?: 0
                          if (r > l) return true
                          if (r < l) return false
                      }
                  } catch (_: Exception) {}
                  return false
              }

              private fun showUpdateDialog(newVersion: String, apkUrl: String) {
                  AlertDialog.Builder(this)
                      .setTitle("🎉 Nouvelle mise à jour dispo (v$newVersion) !")
                      .setMessage("Une nouvelle version de PS PKG Freedom Hub est disponible sur ton dépôt GitHub.\n\nVeux-tu la télécharger et l'installer maintenant ?")
                      .setPositiveButton("Mettre à jour") { _, _ ->
                          downloadAndInstallApk(apkUrl)
                      }
                      .setNegativeButton("Plus tard", null)
                      .show()
              }

              private fun downloadAndInstallApk(apkUrl: String) {
                  toast("📥 Téléchargement de la mise à jour...")
                  Thread {
                      try {
                          val url = URL(apkUrl)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connect()
                          
                          val apkFile = File(getExternalFilesDir(null), "update.apk")
                          if (apkFile.exists()) apkFile.delete()

                          conn.inputStream.use { input ->
                              FileOutputStream(apkFile).use { output ->
                                  input.copyTo(output)
                              }
                          }

                          ui.post {
                              toast("✅ Téléchargement terminé. Installation...")
                              installApk(apkFile)
                          }
                      } catch (e: Exception) {
                          ui.post { toast("❌ Erreur de téléchargement : ${e.message}") }
                      }
                  }.start()
              }

              private fun installApk(file: File) {
                  try {
                      val intent = Intent(Intent.ACTION_VIEW).apply {
                          val uri: Uri = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", file)
                          } else {
                              Uri.fromFile(file)
                          }
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                  } catch (e: Exception) {
                      toast("Erreur d'installation : ${e.message}")
                  }
              }

