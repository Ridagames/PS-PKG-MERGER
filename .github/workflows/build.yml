              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res != RESULT_OK) return
                  if (req == 1) {
                      uris.clear(); names.clear(); sizes.clear()
                      val clip = data?.clipData
                      if (clip != null) {
                          for (i in 0 until clip.itemCount) { val u = clip.getItemAt(i).uri; if (isPkgFile(getFileName(u))) add(u) }
                      } else { data?.data?.let { u -> if (isPkgFile(getFileName(u))) add(u) } }
                      reversed = false; refresh()
                  } else if (req == 2 || req == 4) {
                      val u = data?.data ?: return
                      persist(u, true); output = u
                      if (::outView.isInitialized) { outView.text = "Sortie : ${u.lastPathSegment}" }
                  } else if (req == 3 || req == 5) {
                      val tree = data?.data ?: return
                      try { contentResolver.takePersistableUriPermission(tree, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION) } catch (_: Exception) {}
                      if (req == 5) {
                          output = tree
                          if (::outView.isInitialized) { outView.text = "Dossier de sortie défini" }
                          log("Dossier de destination du Splitter défini.")
                      } else {
                          loadTree(tree)
                      }
                  }
              }

              private fun isPkgFile(name: String): Boolean { val lower = name.lowercase(); return lower.endsWith(".pkg") || lower.contains(".pkg.") }
              private fun getFileName(u: Uri): String {
                  var n = "game.pkg"
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (c.moveToFirst() && ni >= 0 && !c.isNull(ni)) c.getString(ni)?.let { if (it.isNotBlank()) n = it }
                      }
                  } catch (_: Exception) {}
                  return n
              }

              private fun loadTree(tree: Uri) {
                  uris.clear(); names.clear(); sizes.clear()
                  try {
                      val docId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId)
                      val cols = arrayOf(DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME, DocumentsContract.Document.COLUMN_SIZE, DocumentsContract.Document.COLUMN_MIME_TYPE)
                      contentResolver.query(children, cols, null, null, null)?.use { c ->
                          while (c.moveToNext()) {
                              val id = c.getString(0); val name = c.getString(1); val mime = c.getString(3)
                              if (id != null && name != null && mime != DocumentsContract.Document.MIME_TYPE_DIR) {
                                  if (isPkgFile(name)) {
                                      val size = if (c.isNull(2)) 0.toLong() else c.getLong(2)
                                      uris.add(DocumentsContract.buildDocumentUriUsingTree(tree, id)); names.add(name); sizes.add(size)
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  reversed = false; refresh()
              }

              private fun persist(u: Uri, write: Boolean = false) {
                  try {
                      var f = Intent.FLAG_GRANT_READ_URI_PERMISSION
                      if (write) f = f or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      contentResolver.takePersistableUriPermission(u, f)
                  } catch (_: Exception) {}
              }
              private fun add(u: Uri) { persist(u); uris.add(u); names.add(getFileName(u)); sizes.add(size(u)) }

              private data class PkgInfo(val console: String, val valid: Boolean, val contentId: String, val region: String, val icon: Bitmap? = null)

              private fun analyzePkg(u: Uri): PkgInfo {
                  try {
                      contentResolver.openInputStream(u)?.use { input ->
                          val header = ByteArray(512)
                          val read = input.read(header)
                          if (read < 128) return PkgInfo("Inconnu", false, "", "Inconnue")
                          val isCnt = (header[0] == 0x7F.toByte() && header[1] == 'C'.toByte() && header[2] == 'N'.toByte() && header[3] == 'T'.toByte())
                          val isFih = (header[0] == 0x7F.toByte() && header[1] == 'F'.toByte() && header[2] == 'I'.toByte() && header[3] == 'H'.toByte())
                          if (!isCnt && !isFih) return PkgInfo("Invalide", false, "", "Inconnue")
                          var contentId = ""
                          for (i in 48 until 200) {
                              val b = header[i]
                              if (b in 32..126) contentId += b.toChar() else { if (contentId.length >= 20 && contentId.contains("-")) break; contentId = "" }
                          }
                          val region = when {
                              contentId.startsWith("EP", true) || contentId.startsWith("BP", true) -> "🇪🇺 Europe"
                              contentId.startsWith("UP", true) || contentId.startsWith("HP", true) -> "🇺🇸 US"
                              else -> "Inconnue"
                          }
                          val console = if (isFih || getFileName(u).lowercase().contains("ps5")) "PS5" else "PS4"
                          return PkgInfo(console, true, contentId.trim(), region)
                      }
                  } catch (_: Exception) {}
                  return PkgInfo("Invalide", false, "", "Inconnue")
              }

              private fun refresh() {
                  if (!::listContainer.isInitialized) return
                  listContainer.removeAllViews()
                  val cfg = getThemeConfig(currentTheme)
                  if (uris.isEmpty()) {
                      listContainer.addView(text("AUCUN FICHIER SÉLECTIONNÉ", 11f, cfg.dim).apply { typeface = Typeface.MONOSPACE })
                      checkView.text = ""; pkgIconView.visibility = View.GONE; return
                  }
                  val order = order()
                  val total = order.sumOf { sizes[it] }
                  val info = analyzePkg(uris[order[0]])
                  listContainer.addView(text("${order.size} partie(s) • ${fmt(total)}", 12f, cfg.primaryText, true).apply { typeface = Typeface.MONOSPACE })
                  checkView.text = if (info.valid) "► PKG ${info.console} DETECTED\n• CID: ${info.contentId}\n• REGION: ${info.region}" else "⚠️ INVALID PKG HEADER"
              }

              private fun order(): List<Int> {
                  val o = uris.indices.sortedWith { a, b -> names[a].compareTo(names[b]) }
                  return if (reversed) o.reversed() else o
              }

              private fun executeAction() {
                  if (uris.isEmpty()) { toast("Sélectionne d'abord des fichiers."); return }
                  if (appMode == "SPLIT") splitPkg() else mergePkg()
              }
