name: Build Windows App (.exe)

on:
  push:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Réécrire les sources depuis ce workflow (écrase tes modifs)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Générer le projet Windows
        env:
          FORCE: ${{ github.event.inputs.regenerate == 'true' && '1' || '0' }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "app/src/main/kotlin/com/venice/pkgmerger"
          New-Item -ItemType Directory -Force -Path "app/src/main/resources"

          function Write-File([string]$path, [string]$content) {
              if (([Environment]::GetEnvironmentVariable("FORCE") -eq "1") -or (-not (Test-Path $path))) {
                  Write-Host "  écrit   $path"
                  [System.IO.File]::WriteAllText($path, $content, [System.Text.UTF8Encoding]::new($false))
              } else {
                  Write-Host "  conserve $path"
              }
          }

          Write-File ".gitignore" @'
          .gradle/
          build/
          local.properties
          *.exe
          *.jar
          *.zip
          *.jks
          *.keystore
          '@

          Write-File "settings.gradle.kts" @'
          pluginManagement {
              repositories { mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { mavenCentral() }
          }
          rootProject.name = "PS5PkgMergerDesktop"
          include(":app")
          '@

          Write-File "build.gradle.kts" @'
          plugins {
              id("org.jetbrains.kotlin.jvm") version "1.9.0" apply false
          }
          '@

          Write-File "gradle.properties" @'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          kotlin.code.style=official
          '@

          Write-File "app/build.gradle.kts" @'
          plugins {
              kotlin("jvm")
              application
          }

          application {
              mainClass.set("com.venice.pkgmerger.MainKt")
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile> {
              kotlinOptions.jvmTarget = "17"
          }

          tasks.jar {
              manifest {
                  attributes["Main-Class"] = "com.venice.pkgmerger.MainKt"
              }
              from(configurations.runtimeClasspath.get().map { if (it.isDirectory) it else zipTree(it) })
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
          }
          '@

          Write-File "app/src/main/kotlin/com/venice/pkgmerger/Main.kt" @'
          package com.venice.pkgmerger

          import java.awt.*
          import java.io.*
          import java.security.MessageDigest
          import java.util.*
          import javax.swing.*
          import javax.swing.border.EmptyBorder

          class MainWindow : JFrame("⚡ PS5 PKG Merger - Desktop") {

              private val selectedFiles = ArrayList<File>()
              private var outputFile: File? = null
              private var reversed = false
              private var lastHash: String? = null
              @Volatile private var cancelled = false

              private val bgMain = Color(15, 23, 42)
              private val cardBg = Color(30, 41, 59)
              private val accent = Color(56, 189, 248)
              private val dim = Color(148, 163, 184)
              private val textWhite = Color(255, 255, 255)

              private val listLabel = JLabel()
              private val checkLabel = JLabel()
              private val outLabel = JLabel("Sortie : —")
              private val statusLabel = JLabel("Prêt à fusionner.")
              private val hashArea = JTextArea()
              private val hashField = JTextField()
              private val verifyBox = JCheckBox("Relire le fichier après écriture (contrôle intégrité)", true)
              private val deleteBox = JCheckBox("Supprimer les sources après fusion réussie", false)
              private val progressBar = JProgressBar(0, 1000)

              private val pickFilesBtn = JButton("📁 Choisir les fichiers .pkg")
              private val pickDirBtn = JButton("📂 Choisir un dossier complet")
              private val revBtn = JButton("🔀 Inverser l'ordre")
              private val outBtn = JButton("💾 Emplacement de sortie")
              private val goBtn = JButton("▶️ Lancer la fusion")
              private val cancelBtn = JButton("❌ Annuler")
              private val copyBtn = JButton("📋 Copier le SHA-256")

              init {
                  setDefaultCloseOperation(EXIT_ON_CLOSE)
                  setSize(650, 750)
                  setLocationRelativeTo(null)
                  getContentPane().background = bgMain

                  val root = JPanel().apply {
                      layout = BoxLayout(this, BoxLayout.Y_AXIS)
                      background = bgMain
                      border = EmptyBorder(16, 16, 16, 16)
                  }

                  val header = JPanel(GridLayout(2, 1)).apply {
                      background = bgMain
                      alignmentX = Component.LEFT_ALIGNMENT
                      maximumSize = Dimension(Int.MAX_VALUE, 50)
                      add(JLabel("⚡ PS5 PKG MERGER (WINDOWS)").apply {
                          font = Font("Segoe UI", Font.BOLD, 18)
                          foreground = textWhite
                      })
                      add(JLabel("Réassemble tes parties de jeux et vérifie l'intégrité en toute sécurité.").apply {
                          font = Font("Segoe UI", Font.PLAIN, 12)
                          foreground = dim
                      })
                  }
                  root.add(header)
                  root.add(Box.createRigidArea(Dimension(0, 10)))

                  val card1 = createCard("1. Sélection des parties (.pkg / .pkg.0 ...)")
                  val btnPanel1 = JPanel(FlowLayout(FlowLayout.LEFT, 8, 0)).apply {
                      background = cardBg
                      add(pickFilesBtn)
                      add(pickDirBtn)
                      add(revBtn)
                  }
                  card1.add(btnPanel1)
                  card1.add(Box.createRigidArea(Dimension(0, 8)))

                  listLabel.text = "Aucune partie sélectionnée."
                  listLabel.font = Font("Consolas", Font.PLAIN, 12)
                  listLabel.foreground = dim
                  card1.add(listLabel)

                  card1.add(Box.createRigidArea(Dimension(0, 4)))
                  checkLabel.font = Font("Consolas", Font.PLAIN, 12)
                  card1.add(checkLabel)
                  root.add(card1)
                  root.add(Box.createRigidArea(Dimension(0, 10)))

                  val card2 = createCard("2. Fichier de sortie & Fusion")
                  val btnPanel2 = JPanel(FlowLayout(FlowLayout.LEFT, 8, 0)).apply {
                      background = cardBg
                      add(outBtn)
                  }
                  card2.add(btnPanel2)
                  card2.add(Box.createRigidArea(Dimension(0, 4)))

                  outLabel.font = Font("Consolas", Font.PLAIN, 12)
                  outLabel.foreground = dim
                  card2.add(outLabel)
                  card2.add(Box.createRigidArea(Dimension(0, 8)))

                  val btnPanel3 = JPanel(FlowLayout(FlowLayout.LEFT, 8, 0)).apply {
                      background = cardBg
                      goBtn.foreground = Color(0, 100, 0)
                      cancelBtn.isEnabled = false
                      add(goBtn)
                      add(cancelBtn)
                  }
                  card2.add(btnPanel3)
                  card2.add(Box.createRigidArea(Dimension(0, 8)))

                  progressBar.maximum = 1000
                  progressBar.value = 0
                  progressBar.preferredSize = Dimension(580, 22)
                  card2.add(progressBar)
                  card2.add(Box.createRigidArea(Dimension(0, 6)))

                  statusLabel.font = Font("Segoe UI", Font.BOLD, 13)
                  statusLabel.foreground = accent
                  card2.add(statusLabel)
                  root.add(card2)
                  root.add(Box.createRigidArea(Dimension(0, 10)))

                  val card3 = createCard("3. Options de sécurité & Hash")
                  verifyBox.foreground = dim
                  verifyBox.background = cardBg
                  card3.add(verifyBox)

                  deleteBox.foreground = dim
                  deleteBox.background = cardBg
                  card3.add(deleteBox)
                  card3.add(Box.createRigidArea(Dimension(0, 6)))

                  card3.add(JLabel("Hash attendu (Optionnel : MD5 / SHA-1 / SHA-256)").apply {
                      foreground = dim
                      font = Font("Segoe UI", Font.PLAIN, 11)
                  })
                  hashField.font = Font("Consolas", Font.PLAIN, 11)
                  hashField.background = bgMain
                  hashField.foreground = textWhite
                  card3.add(hashField)
                  card3.add(Box.createRigidArea(Dimension(0, 4)))

                  hashArea.font = Font("Consolas", Font.PLAIN, 11)
                  hashArea.background = bgMain
                  hashArea.foreground = accent
                  hashArea.isEditable = false
                  card3.add(JScrollPane(hashArea).apply { preferredSize = Dimension(580, 50) })
                  card3.add(Box.createRigidArea(Dimension(0, 6)))

                  copyBtn.isEnabled = false
                  card3.add(copyBtn)
                  root.add(card3)

                  add(JScrollPane(root).apply { border = null })

                  pickFilesBtn.addActionListener { pickFiles() }
                  pickDirBtn.addActionListener { pickFolder() }
                  revBtn.addActionListener { reversed = !reversed; refreshList() }
                  outBtn.addActionListener { pickOutput() }
                  goBtn.addActionListener { startMerge() }
                  cancelBtn.addActionListener { cancelled = true }
                  copyBtn.addActionListener { copyHashToClipboard() }

                  refreshList()
                  setVisible(true)
              }

              private fun createCard(title: String): JPanel {
                  return JPanel().apply {
                      layout = BoxLayout(this, BoxLayout.Y_AXIS)
                      background = cardBg
                      border = BorderFactory.createCompoundBorder(
                          BorderFactory.createLineBorder(Color(51, 65, 85), 1),
                          EmptyBorder(12, 12, 12, 12)
                      )
                      alignmentX = Component.LEFT_ALIGNMENT
                      add(JLabel(title).apply {
                          font = Font("Segoe UI", Font.BOLD, 13)
                          foreground = accent
                      })
                      add(Box.createRigidArea(Dimension(0, 8)))
                  }
              }

              private fun pickFiles() {
                  val chooser = JFileChooser().apply {
                      isMultiSelectionEnabled = true
                      fileSelectionMode = JFileChooser.FILES_ONLY
                  }
                  if (chooser.showOpenDialog(this) == JFileChooser.APPROVE_OPTION) {
                      selectedFiles.clear()
                      selectedFiles.addAll(chooser.selectedFiles)
                      reversed = false
                      refreshList()
                  }
              }

              private fun pickFolder() {
                  val chooser = JFileChooser().apply {
                      fileSelectionMode = JFileChooser.DIRECTORIES_ONLY
                  }
                  if (chooser.showOpenDialog(this) == JFileChooser.APPROVE_OPTION) {
                      val dir = chooser.selectedFile
                      val allFiles = dir.listFiles()?.filter { it.isFile && isPkgPart(it.name) } ?: emptyList()
                      selectedFiles.clear()
                      selectedFiles.addAll(allFiles.ifEmpty { dir.listFiles()?.filter { it.isFile } ?: emptyList() })
                      reversed = false
                      refreshList()
                      if (selectedFiles.size < 2) {
                          JOptionPane.showMessageDialog(this, "Aucune partie .pkg trouvée dans ce dossier.", "Attention", JOptionPane.WARNING_MESSAGE)
                      }
                  }
              }

              private fun pickOutput() {
                  if (selectedFiles.isEmpty()) {
                      JOptionPane.showMessageDialog(this, "Choisis d'abord les parties sources !", "Attention", JOptionPane.WARNING_MESSAGE)
                      return
                  }
                  val chooser = JFileChooser().apply {
                      selectedFile = File(suggestName())
                  }
                  if (chooser.showSaveDialog(this) == JFileChooser.APPROVE_OPTION) {
                      outputFile = chooser.selectedFile
                      outLabel.text = "Sortie : ${outputFile?.name}"
                  }
              }

              private fun refreshList() {
                  if (selectedFiles.isEmpty()) {
                      listLabel.text = "Aucune partie sélectionnée."
                      checkLabel.text = ""
                      return
                  }
                  val order = orderIndices()
                  val totalSize = order.sumOf { selectedFiles[it].length() }
                  val sb = StringBuilder("<html>${order.size} partie(s)")
                  if (totalSize > 0) sb.append(" • ").append(fmtSize(totalSize))
                  sb.append(" • ordre ").append(if (reversed) "inversé" else "croissant").append("<br>")
                  order.forEachIndexed { i, idx ->
                      val f = selectedFiles[idx]
                      sb.append("${i + 1}.${f.name}")
                      if (f.length() > 0) sb.append(" (${fmtSize(f.length())})")
                      sb.append("<br>")
                  }
                  sb.append("</html>")
                  listLabel.text = sb.toString()
                  checkLabel.text = checkHeaderAndSizes(order)
              }

              private fun checkHeaderAndSizes(order: List<Int>): String {
                  if (order.isEmpty()) return ""
                  val sb = StringBuilder("<html>")
                  val first = selectedFiles[order[0]]
                  if (hasPkgMagic(first)) {
                      sb.append("<font color=\"#34D399\">✓ En-tête PKG valide (7F 43 4E 54)</font><br>")
                  } else {
                      sb.append("<font color=\"#FBBF24\">⚠ En-tête PKG absent sur la 1re partie</font><br>")
                  }
                  val sizes = order.map { selectedFiles[it].length() }
                  val body = sizes.dropLast(1)
                  when {
                      body.isEmpty() -> sb.append("<font color=\"#94A3B8\">• Une seule partie</font>")
                      body.distinct().size > 1 -> sb.append("<font color=\"#FBBF24\">⚠ Parties de tailles différentes</font>")
                      sizes.last() > body[0] -> sb.append("<font color=\"#FBBF24\">⚠ Dernière partie plus grande que les autres</font>")
                      else -> sb.append("<font color=\"#34D399\">✓ Tailles cohérentes (${fmtSize(body[0])} par partie)</font>")
                  }
                  sb.append("</html>")
                  return sb.toString()
              }

              private fun orderIndices(): List<Int> {
                  val indices = selectedFiles.indices.sortedWith { a, b -> naturalCompare(selectedFiles[a].name, selectedFiles[b].name) }
                  return if (reversed) indices.reversed() else indices
              }

              private fun startMerge() {
                  if (selectedFiles.size < 2) {
                      JOptionPane.showMessageDialog(this, "Sélectionne au moins 2 parties.", "Erreur", JOptionPane.ERROR_MESSAGE)
                      return
                  }
                  val out = outputFile
                  if (out == null) {
                      JOptionPane.showMessageDialog(this, "Choisis d'abord l'emplacement de sortie.", "Erreur", JOptionPane.ERROR_MESSAGE)
                      return
                  }

                  val list = orderIndices().map { selectedFiles[it] }
                  val wantReread = verifyBox.isSelected
                  val wantDelete = deleteBox.isSelected

                  cancelled = false
                  setUiEnabled(false)
                  hashArea.text = ""
                  progressBar.value = 0
                  statusLabel.text = "Fusion en cours..."

                  Thread {
                      val totalSize = list.sumOf { it.length() }
                      val md5 = MessageDigest.getInstance("MD5")
                      val sha1 = MessageDigest.getInstance("SHA-1")
                      val sha256 = MessageDigest.getInstance("SHA-256")
                      val problems = ArrayList<String>()
                      var done = 0L
                      var success = false
                      val t0 = System.currentTimeMillis()

                      try {
                          BufferedOutputStream(FileOutputStream(out), 1024 * 1024).use { os ->
                              val buf = ByteArray(1024 * 1024)
                              for (f in list) {
                                  if (cancelled) throw InterruptedException("Fusion annulée")
                                  FileInputStream(f).use { ins ->
                                      while (true) {
                                          if (cancelled) throw InterruptedException("Fusion annulée")
                                          val r = ins.read(buf)
                                          if (r <= 0) break
                                          os.write(buf, 0, r)
                                          md5.update(buf, 0, r)
                                          sha1.update(buf, 0, r)
                                          sha256.update(buf, 0, r)
                                          done += r
                                          updateProgress(done, totalSize, t0)
                                      }
                                  }
                              }
                              os.flush()
                          }
                          success = true
                      } catch (e: Throwable) {
                          SwingUtilities.invokeLater {
                              statusLabel.text = if (cancelled) "Fusion annulée." else "Erreur : ${e.message}"
                              setUiEnabled(true)
                          }
                          return@Thread
                      }

                      if (!success) return@Thread

                      val h256 = hex(sha256.digest())
                      val disk = out.length()
                      if (totalSize > 0 && disk != done) {
                          problems.add("Taille sur disque différente de l'écrit")
                      }

                      if (wantReread) {
                          SwingUtilities.invokeLater { statusLabel.text = "Vérification en cours..." }
                          try {
                              val re = MessageDigest.getInstance("SHA-256")
                              FileInputStream(out).use { ins ->
                                  val b = ByteArray(1024 * 1024)
                                  while (true) {
                                      val r = ins.read(b)
                                      if (r <= 0) break
                                      re.update(b, 0, r)
                                  }
                              }
                              if (hex(re.digest()) != h256) {
                                  problems.add("Hash différent après relecture")
                              }
                          } catch (_: Throwable) {
                              problems.add("Relecture impossible")
                          }
                      }

                      if (wantDelete && problems.isEmpty()) {
                          for (f in list) { try { f.delete() } catch (_: Exception) {} }
                      }

                      val secs = (System.currentTimeMillis() - t0) / 1000
                      val report = StringBuilder("SHA-256 : $h256\n")
                      if (problems.isEmpty()) {
                          report.append("✓ Fusion réussie et vérifiée (${fmtSize(done)})")
                      } else {
                          problems.forEach { report.append("⚠ $it\n") }
                      }

                      SwingUtilities.invokeLater {
                          progressBar.value = 1000
                          lastHash = h256
                          copyBtn.isEnabled = true
                          hashArea.text = report.toString()
                          statusLabel.text = "Terminé avec succès en ${secs}s"
                          setUiEnabled(true)
                      }
                  }.start()
              }

              private fun updateProgress(done: Long, total: Long, t0: Long) {
                  val elapsed = (System.currentTimeMillis() - t0) / 1000.0
                  val speed = if (elapsed > 0.5) done / elapsed else 0.0
                  val pct = if (total > 0) (done * 1000 / total).toInt() else 0
                  val eta = if (speed > 0 && total > done) ((total - done) / speed).toLong() else -1L
                  val msg = buildString {
                      append(fmtSize(done))
                      if (total > 0) { append(" / "); append(fmtSize(total)) }
                      append(" • ").append(fmtSize(speed.toLong())).append("/s")
                      if (eta > 0) append(" • reste ${eta}s")
                  }
                  SwingUtilities.invokeLater {
                      progressBar.value = pct
                      statusLabel.text = msg
                  }
              }

              private fun setUiEnabled(enabled: Boolean) {
                  pickFilesBtn.isEnabled = enabled
                  pickDirBtn.isEnabled = enabled
                  revBtn.isEnabled = enabled
                  outBtn.isEnabled = enabled
                  goBtn.isEnabled = enabled
                  cancelBtn.isEnabled = !enabled
              }

              private fun copyHashToClipboard() {
                  val h = lastHash ?: return
                  Toolkit.getDefaultToolkit().systemClipboard.setContents(java.awt.datatransfer.StringSelection(h), null)
                  JOptionPane.showMessageDialog(this, "SHA-256 copié dans le presse-papier !", "Succès", JOptionPane.INFORMATION_MESSAGE)
              }

              private fun hasPkgMagic(f: File): Boolean {
                  return try {
                      FileInputStream(f).use {
                          val b = ByteArray(4)
                          it.read(b) == 4 && b[0] == 0x7F.toByte() && b[1] == 0x43.toByte() && b[2] == 0x4E.toByte() && b[3] == 0x54.toByte()
                      }
                  } catch (_: Exception) { false }
              }

              private fun hex(b: ByteArray): String = b.joinToString("") { "%02x".format(it) }

              private fun fmtSize(bytes: Long): String {
                  if (bytes <= 0) return "0 o"
                  val units = arrayOf("o", "Ko", "Mo", "Go", "To")
                  var v = bytes.toDouble()
                  var i = 0
                  while (v >= 1024 && i < units.size - 1) { v /= 1024; i++ }
                  return if (i == 0) "$bytes o" else "%.2f %s".format(Locale.US, v, units[i])
              }

              private val chunkRegex = Regex("(\\d+|\\D+)")
              private val pkgRegex = Regex("(?i)^.+\\.pkg(\\.(\\d+|part\\d+))?$")
              private fun isPkgPart(name: String) = pkgRegex.matches(name)

              private fun naturalCompare(a: String, b: String): Int {
                  val ca = chunkRegex.findAll(a).map { it.value }.toList()
                  val cb = chunkRegex.findAll(b).map { it.value }.toList()
                  for (i in 0 until minOf(ca.size, cb.size)) {
                      val x = ca[i]
                      val y = cb[i]
                      val dx = x[0].isDigit()
                      val dy = y[0].isDigit()
                      val c = when {
                          dx && dy -> {
                              val xs = x.trimStart('0').ifEmpty { "0" }
                              val ys = y.trimStart('0').ifEmpty { "0" }
                              if (xs.length != ys.length) xs.length - ys.length else xs.compareTo(ys)
                          }
                          dx != dy -> if (dx) 1 else -1
                          else -> x.compareTo(y, true)
                      }
                      if (c != 0) return c
                  }
                  return ca.size - cb.size
              }

              private fun suggestName(): String {
                  if (selectedFiles.isEmpty()) return "merged.pkg"
                  val first = selectedFiles.minWithOrNull { a, b -> naturalCompare(a.name, b.name) }?.name ?: return "merged.pkg"
                  val m = Regex("^(.*?)[._\\- ]?(?:part)?[._\\- ]?(\\d+)$", RegexOption.IGNORE_CASE).find(first)
                  var base = m?.groupValues?.get(1)?.trimEnd('.', '_', '-', ' ') ?: first
                  if (base.isBlank()) base = "merged"
                  return if (base.lowercase().endsWith(".pkg")) base else "$base.pkg"
              }
          }

          fun main() {
              SwingUtilities.invokeLater { MainWindow() }
          }
          '@

      - name: Build JAR
        run: ./gradlew.bat jar

      - name: Créer le fichier .exe avec jpackage
        run: |
          $javaHome =$env:JAVA_HOME
          & "$javaHome\bin\jpackage.exe" `
              --type app-image `
              --name "PS5PkgMerger" `
              --input "app/build/libs" `
              --main-jar "app.jar" `
              --main-class "com.venice.pkgmerger.MainKt" `
              --dest "dist"

      - name: Compresser l'application en ZIP
        run: |
          Compress-Archive -Path "dist\PS5PkgMerger" -DestinationPath "PS5PkgMerger-Windows.zip" -Force

      - name: Upload Windows EXE Package
        uses: actions/upload-artifact@v4
        with:
          name: ps5-pkg-merger-windows-exe
          path: PS5PkgMerger-Windows.zip
          if-no-files-found: error
