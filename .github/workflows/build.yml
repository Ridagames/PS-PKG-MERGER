              private fun checkFirstRunWelcome() {
                  val isFirstRun = prefs.getBoolean("is_first_run", true)
                  if (isFirstRun) {
                      prefs.edit().putBoolean("is_first_run", false).apply()
                      AlertDialog.Builder(this)
