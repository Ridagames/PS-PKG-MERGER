              override fun onResume() {
                  super.onResume()
                  setupBackgroundMedia()
              }

              override fun onPause() {
                  super.onPause()
                  bgVideoView?.pause()
                  try { musicPlayer?.pause() } catch (_: Exception) {}
                  stopFortniteBusAnimation()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { musicPlayer?.release() } catch (_: Exception) {}
                  clickPlayer?.release()
                  fnBusPlayer?.release()
                  stopFortniteBusAnimation()
              }

              private fun applyTheme() {
                  val cfg = getThemeConfig(currentTheme)

                  rootFrameLayout.setBackgroundColor(cfg.bg)
                  rootLayout.setBackgroundColor(Color.TRANSPARENT)
                  mainCol.setBackgroundColor(Color.TRANSPARENT)

                  titleView.setTextColor(cfg.primaryText)
                  subtitleView.setTextColor(cfg.secondaryText)
                  subtitleView.text = "${tr("universe")} : ${cfg.name.uppercase()}"

                  section1Title.setTextColor(cfg.secondaryText)
                  section2Title.setTextColor(cfg.secondaryText)
                  section3Title.setTextColor(cfg.secondaryText)

                  checkView.setTextColor(cfg.secondaryText)
                  statusView.setTextColor(cfg.primaryText)
                  consoleLogView.setTextColor(cfg.dim)
                  hashView.setTextColor(cfg.secondaryText)

                  verifyBox.setTextColor(cfg.dim)
                  deleteBox.setTextColor(cfg.dim)
                  outView.setTextColor(cfg.dim)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      val barColor = if (currentTheme == "FORTNITE") Color.parseColor("#00D9FF") else cfg.primaryText
                      bar.progressTintList = ColorStateList.valueOf(barColor)
                      bar.progressBackgroundTintList = ColorStateList.valueOf(cfg.card)
                  }

                  cardViews.forEach { card ->
                      card.background = GradientDrawable().apply {
                          setColor(cfg.card)
                          cornerRadius = dp(8).toFloat()
                          setStroke(dp(2), Color.parseColor(cfg.border))
                      }
                  }

                  rebuildButtons()

                  val modeBtnStyleBg = GradientDrawable().apply {
                      setColor(Color.parseColor(cfg.btnRev.first))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(2), Color.parseColor(cfg.btnRev.second))
                  }
                  menuBtn.background = modeBtnStyleBg
                  menuBtn.setTextColor(cfg.secondaryText)
                  menuBtn.text = tr("menu_btn")
                  menuBtn.setOnClickListener { showCustomMenu(menuBtn) }

                  setupBackgroundMedia()
                  refresh()
              }

              private fun rebuildButtons() {
                  val cfg = getThemeConfig(currentTheme)

                  val parentCard1 = pickBtnLayout.parent as? LinearLayout
                  val parentCard2 = outBtnLayout.parent as? LinearLayout
                  val parentCard3 = copyBtnLayout.parent as? LinearLayout

                  val idxPick = parentCard1?.indexOfChild(pickBtnLayout) ?: -1
                  val idxDir = parentCard1?.indexOfChild(dirBtnLayout) ?: -1
                  val idxRev = parentCard1?.indexOfChild(revBtnLayout) ?: -1
                  val idxOut = parentCard2?.indexOfChild(outBtnLayout) ?: -1
                  val idxGo = (goBtnLayout.parent as? LinearLayout)?.indexOfChild(goBtnLayout) ?: -1
                  val idxCancel = (cancelBtnLayout.parent as? LinearLayout)?.indexOfChild(cancelBtnLayout) ?: -1
                  val idxCopy = parentCard3?.indexOfChild(copyBtnLayout) ?: -1

                  val actionContainer = goBtnLayout.parent as? LinearLayout

                  pickBtnLayout = createCustomButton(tr("btn_pick"), cfg.btnPick.first, cfg.btnPick.second, 1, false) { pick() }
                  dirBtnLayout = createCustomButton(tr("btn_dir"), cfg.btnDir.first, cfg.btnDir.second, 2, false) { pickFolder() }
                  revBtnLayout = createCustomButton(tr("btn_rev"), cfg.btnRev.first, cfg.btnRev.second, 1, false) { reversed = !reversed; refresh() }
                  outBtnLayout = createCustomButton(tr("btn_out"), cfg.btnOut.first, cfg.btnOut.second, 2, false) { pickOutput() }
                  val goTextKey = if (appMode == "SPLIT") "btn_go_split" else "btn_go_merge"
                  goBtnLayout = createCustomButton(tr(goTextKey), cfg.btnGo.first, cfg.btnGo.second, 0, false) { executeAction() }
                  cancelBtnLayout = createCustomButton(tr("btn_cancel"), cfg.btnCancel.first, cfg.btnCancel.second, 0, true) {
                      if (processing) { cancelled = true; statusView.text = "Annulation..." }
                  }
                  copyBtnLayout = createCustomButton(tr("btn_copy"), cfg.btnRev.first, cfg.btnRev.second, 0, false) { copyHash() }

                  if (parentCard1 != null && idxPick != -1) {
                      parentCard1.removeViewAt(idxPick); parentCard1.addView(pickBtnLayout, idxPick, lp())
                      parentCard1.removeViewAt(idxDir); parentCard1.addView(dirBtnLayout, idxDir, lp())
                      parentCard1.removeViewAt(idxRev); parentCard1.addView(revBtnLayout, idxRev, lp())
                  }

                  if (parentCard2 != null && idxOut != -1) {
                      parentCard2.removeViewAt(idxOut); parentCard2.addView(outBtnLayout, idxOut, lp())
                  }

                  if (actionContainer != null && idxGo != -1) {
                      actionContainer.removeViewAt(idxGo)
                      actionContainer.addView(goBtnLayout, idxGo, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                      actionContainer.removeViewAt(idxCancel)
                      actionContainer.addView(cancelBtnLayout, idxCancel, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { leftMargin = dp(8) })
                  }

                  if (parentCard3 != null && idxCopy != -1) {
                      parentCard3.removeViewAt(idxCopy); parentCard3.addView(copyBtnLayout, idxCopy, lp())
                  }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "pkg_channel",
                          "PS PKG Notifications",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply { description = "Progression des traitements PKG" }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 100)
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun updateProgressNotif(msg: String, pct: Int) {
                  try {
                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle("⚡ PS PKG Hub")
                          .setContentText(msg)
                          .setSmallIcon(R.drawable.ic_app_logo)
                          .setProgress(100, pct, false)
                          .setOngoing(true)
                          .build()

                      getSystemService(NotificationManager::class.java).notify(NOTIF_ID_PROGRESS, notification)
                  } catch (_: Exception) {}
              }

              private fun showResultNotif(title: String, message: String) {
                  try {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.cancel(NOTIF_ID_PROGRESS)

                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle(title)
                          .setContentText(message)
                          .setSmallIcon(R.drawable.ic_app_logo)
                          .setAutoCancel(true)
                          .build()

                      nm.notify(NOTIF_ID_RESULT, notification)
                  } catch (_: Exception) {}
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun triggerSuccessReward() {
                  if (currentTheme == "FORTNITE") {
                      playClickSound("fn_chest_open")
                      var closedRes = resources.getIdentifier("fn_chest_closed", "drawable", packageName)
                      if (closedRes == 0) closedRes = resources.getIdentifier("img_fn_chest_closed", "drawable", packageName)
                      if (closedRes != 0 && rewardChestView != null) {
                          rewardChestView?.setImageResource(closedRes)
                          rewardChestView?.visibility = View.VISIBLE
                          rewardChestView?.bringToFront()
                          
                          rewardChestView?.setOnClickListener {
                              val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                              vibrator?.vibrate(VibrationEffect.createOneShot(120, VibrationEffect.DEFAULT_AMPLITUDE))
                              rewardChestView?.animate()?.scaleX(1.35f)?.scaleY(1.35f)?.setDuration(90)?.withEndAction {
                                  rewardChestView?.animate()?.scaleX(1.0f)?.scaleY(1.0f)?.setDuration(90)?.start()
                              }?.start()
                              
                              val actionWord = if (appMode == "SPLIT") "découpage" else "fusion"
                              showInteractivePopup("$actionWord réussie grâce à moi ! Le coffre")
                          }

                          rewardChestView?.animate()?.scaleX(1.3f)?.scaleY(1.3f)?.setDuration(220)?.withEndAction {
                              rewardChestView?.animate()?.scaleX(1.0f)?.scaleY(1.0f)?.setDuration(220)?.start()
                          }?.start()
                      }
                  }
              }

              private fun showMergerScreen() {
