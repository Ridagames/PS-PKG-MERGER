              private fun text(t: String, size: Float, color: Int, bold: Boolean = false) =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, dp(2), 0, dp(2))
                  }

              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_SHORT).show()

              private fun pick() {
                  log("Ouverture du sélecteur de fichiers...")
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      }, 1
                  )
              }

              private fun pickFolder() {
                  log("Ouverture du sélecteur de dossier...")
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                      }, 3
                  )
              }

              private fun pickOutput() {
                  if (uris.isEmpty()) {
                      toast("Choisis d'abord les sources !")
                      log("Erreur: Tentative de définir la sortie sans source.")
                      return
                  }
                  if (appMode == "SPLIT") {
                      startActivityForResult(
                          Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                          }, 5
                      )
                  } else {
                      val rawName = suggestName()
                      val baseName = if (rawName.lowercase().endsWith(".pkg")) rawName.substringBeforeLast(".") else rawName
                      log("Ouverture de la création de document pour : $baseName.pkg")
                      startActivityForResult(
                          Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "application/octet-stream"
                              putExtra(Intent.EXTRA_TITLE, "$baseName.pkg")
                          }, 4
                      )
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res != RESULT_OK) {
                      log("Action annulée par l'utilisateur (req=$req).")
                      return
                  }

                  if (req == 1) {
                      uris.clear(); names.clear(); sizes.clear()
                      val clip = data?.clipData
                      if (clip != null) {
                          for (i in 0 until clip.itemCount) {
                              val u = clip.getItemAt(i).uri
                              if (isPkgFile(getFileName(u))) add(u)
                          }
                      } else {
                          data?.data?.let { u -> if (isPkgFile(getFileName(u))) add(u) }
                      }
                      reversed = false
                      rewardChestView?.visibility = View.GONE
                      log("Fichiers chargés : ${uris.size} fichier(s)")
                      refresh()
                  } else if (req == 2 || req == 4) {
                      val u = data?.data ?: return
                      persist(u, true)
                      output = u
                      log("Emplacement de sortie défini : ${u.lastPathSegment}")
                      if (::outView.isInitialized) {
                          outView.text = "Sortie : ${u.lastPathSegment}"
                      }
                  } else if (req == 3 || req == 5) {
                      val tree = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(tree, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                      } catch (_: Exception) {}
                      if (req == 5) {
                          output = tree
                          if (::outView.isInitialized) outView.text = "Dossier de sortie défini"
                          log("Dossier de destination du Splitter défini.")
                      } else {
                          log("Dossier sélectionné via Tree API")
                          loadTree(tree)
                      }
                  }
              }

              private fun isPkgFile(name: String): Boolean {
                  val lower = name.lowercase()
                  return lower.endsWith(".pkg") || lower.contains(".pkg.")
              }

              private fun getFileName(u: Uri): String {
                  var n = "game.pkg"
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (c.moveToFirst() && ni >= 0 && !c.isNull(ni)) c.getString(ni)?.let { if (it.isNotBlank()) n = it }
                      }
                  } catch (_: Exception) {}
                  return n
              }

              private fun loadTree(tree: Uri) {
                  uris.clear(); names.clear(); sizes.clear()
                  try {
                      val docId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId)
                      val cols = arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_SIZE,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      )
                      contentResolver.query(children, cols, null, null, null)?.use { c ->
                          while (c.moveToNext()) {
                              val id = c.getString(0)
                              val name = c.getString(1)
                              val mime = c.getString(3)
                              if (id != null && name != null && mime != DocumentsContract.Document.MIME_TYPE_DIR) {
                                  if (isPkgFile(name)) {
                                      val size = if (c.isNull(2)) 0.toLong() else c.getLong(2)
                                      uris.add(DocumentsContract.buildDocumentUriUsingTree(tree, id))
                                      names.add(name)
                                      sizes.add(size)
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      log("Erreur lecture dossier : ${e.message}")
                  }
                  reversed = false
                  rewardChestView?.visibility = View.GONE
                  refresh()
                  log("Dossier chargé : ${uris.size} fichier(s) PKG trouvé(s)")
              }

              private fun persist(u: Uri, write: Boolean = false) {
                  try {
                      var f = Intent.FLAG_GRANT_READ_URI_PERMISSION
                      if (write) f = f or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      contentResolver.takePersistableUriPermission(u, f)
                  } catch (_: Exception) {}
              }

              private fun add(u: Uri) {
                  persist(u)
                  var n = getFileName(u)
                  var s = size(u)
                  uris.add(u); names.add(n); sizes.add(s)
                  log("Ajouté : $n (${fmt(s)})")
              }

              private fun removeAt(index: Int) {
                  if (index in uris.indices) {
                      log("Suppression de : ${names[index]}")
                      uris.removeAt(index)
                      names.removeAt(index)
                      sizes.removeAt(index)
                      rewardChestView?.visibility = View.GONE
                      refresh()
                  }
              }

              private data class PkgInfo(val console: String, val valid: Boolean, val contentId: String, val region: String, val icon: Bitmap? = null)

              private fun analyzePkg(u: Uri): PkgInfo {
                  try {
                      contentResolver.openInputStream(u)?.use { input ->
                          val header = ByteArray(512)
                          val read = input.read(header)
                          if (read < 128) return PkgInfo("Inconnu", false, "", "Inconnue")

                          val isCnt = (header[0] == 0x7F.toByte() && header[1] == 'C'.toByte() && 
                                       header[2] == 'N'.toByte() && header[3] == 'T'.toByte())
                          val isFih = (header[0] == 0x7F.toByte() && header[1] == 'F'.toByte() && 
                                       header[2] == 'I'.toByte() && header[3] == 'H'.toByte())

                          if (!isCnt && !isFih) return PkgInfo("Invalide", false, "", "Inconnue")

                          var contentId = ""
                          for (i in 48 until 200) {
                              val b = header[i]
                              if (b in 32..126) {
                                  contentId += b.toChar()
                              } else {
                                  if (contentId.length >= 20 && contentId.contains("-")) break
                                  contentId = ""
                              }
                          }

                          val region = when {
                              contentId.startsWith("EP", true) || contentId.startsWith("BP", true) -> "🇪🇺 Europe (EP/BP)"
                              contentId.startsWith("UP", true) || contentId.startsWith("HP", true) -> "🇺🇸 US (UP/HP)"
                              contentId.startsWith("JP", true) || contentId.startsWith("AP", true) -> "🇯🇵 / Asie (JP/AP)"
                              else -> "Inconnue"
                          }

                          val name = getFileName(u).lowercase()
                          val console = when {
                              name.contains("ps3") || name.contains("nplb") -> "PS3"
                              name.contains("ps4") || name.contains("cusa") -> "PS4"
                              name.contains("ps5") || name.contains("ppsa") || isFih -> "PS5"
                              else -> "PS5/PS4"
                          }

                          var iconBitmap: Bitmap? = null
                          try {
                              val iconBuf = ByteArray(256 * 1024)
                              val iconRead = input.read(iconBuf)
                              if (iconRead > 0) {
                                  for (i in 0 until iconRead - 8) {
                                      if (iconBuf[i] == 0x89.toByte() && iconBuf[i+1] == 'P'.toByte() &&
                                          iconBuf[i+2] == 'N'.toByte() && iconBuf[i+3] == 'G'.toByte()) {
                                          iconBitmap = BitmapFactory.decodeByteArray(iconBuf, i, iconRead - i)
                                          break
                                      }
                                  }
                              }
                          } catch (_: Exception) {}

                          return PkgInfo(console, true, contentId.trim(), region, iconBitmap)
                      }
                  } catch (_: Exception) {}
                  return PkgInfo("Invalide", false, "", "Inconnue")
              }

              private fun refresh() {
                  if (!::listContainer.isInitialized) return
                  listContainer.removeAllViews()

                  val cfg = getThemeConfig(currentTheme)

                  if (uris.isEmpty()) {
                      val emptyMsg = when (currentLang) {
                          "en" -> "NO FILES SELECTED"
                          "es" -> "NINGÚN ARCHIVO SELECCIONADO"
                          "pt" -> "NENHUM ARQUIVO SELECIONADO"
                          "de" -> "KEINE DATEIEN AUSGEWÄHLT"
                          else -> "AUCUN FICHIER SÉLECTIONNÉ"
                      }
                      listContainer.addView(text(emptyMsg, 11f, cfg.dim).apply { typeface = Typeface.MONOSPACE })
                      checkView.text = ""
                      pkgIconView.visibility = View.GONE
                      return
                  }

                  val order = order()
                  val total = order.sumOf { sizes[it] }
                  val info = analyzePkg(uris[order[0]])

                  val orderWord = if (reversed) "inversé" else "croissant"
                  val partsWord = "partie(s)"

                  val summaryView = text("${order.size} $partsWord • ${fmt(total)} • Order $orderWord", 12f, cfg.primaryText, true).apply { typeface = Typeface.MONOSPACE }
                  listContainer.addView(summaryView)

                  order.forEachIndexed { i, idx ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(dp(12), dp(8), dp(12), dp(8))
                          gravity = Gravity.CENTER_VERTICAL
                          background = GradientDrawable().apply {
                              setColor(cfg.bg)
                              cornerRadius = dp(6).toFloat()
                              setStroke(dp(1), Color.parseColor(cfg.border))
                          }
                      }

                      val itemText = TextView(this).apply {
                          text = "[${i + 1}] ${names[idx]}\n↳ ${fmt(sizes[idx])}"
                          textSize = 11f
                          setTextColor(Color.WHITE)
                          typeface = Typeface.MONOSPACE
                      }
                      row.addView(itemText, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                      val deleteBtn = Button(this).apply {
                          text = "🚫"
                          textSize = 12f
                          setBackgroundColor(Color.TRANSPARENT)
                          setOnClickListener {
                              if (processing) { toast("⚠️ Traitement en cours !"); return@setOnClickListener }
                              removeAt(idx)
                          }
                      }
                      row.addView(deleteBtn, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))

                      val marginLp = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply {
                          topMargin = dp(4)
                          bottomMargin = dp(4)
                      }
                      listContainer.addView(row, marginLp)
                  }

                  if (info.icon != null) {
                      pkgIconView.setImageBitmap(info.icon)
                      pkgIconView.visibility = View.VISIBLE
                  } else {
                      pkgIconView.visibility = View.GONE
                  }

                  checkView.text = if (info.valid) {
                      buildString {
                          append("► PKG ").append(info.console).append(" DETECTED\n")
                          if (info.contentId.isNotEmpty()) append("• CID: ").append(info.contentId).append("\n")
                          append("• REGION: ").append(info.region)
                      }
                  } else {
                      "⚠️ INVALID PKG HEADER"
                  }
              }

              private fun order(): List<Int> {
                  val o = uris.indices.sortedWith { a, b -> naturalCompare(names[a], names[b]) }
                  return if (reversed) o.reversed() else o
              }

              private fun executeAction() {
                  if (uris.isEmpty()) {
                      toast("Sélectionne d'abord des fichiers.")
                      log("Erreur : Aucune source sélectionnée.")
                      return
                  }
                  if (output == null) {
                      toast("Définis d'abord l'emplacement de sortie !")
                      log("Erreur : Sortie non définie.")
                      return
                  }
                  if (appMode == "SPLIT") {
                      splitPkg()
                  } else {
                      mergePkg()
                  }
              }

              private fun splitPkg() {
                  val treeUri = output ?: return
                  val sourceUri = uris[0]
                  processing = true
                  cancelled = false
                  goBtnLayout.isEnabled = false
                  cancelBtnLayout.isEnabled = true
                  rewardChestView?.visibility = View.GONE
                  bar.progress = 0
                  statusView.text = "Découpage en cours…"
                  log("=== DÉBUT DU DÉCOUPAGE ===")

                  Thread {
                      val total = size(sourceUri)
                      var done = 0L
                      var success = false
                      val maxPartSize = 4L * 1024 * 1024 * 1024
                      var partIndex = 0
                      val baseFileName = getFileName(sourceUri)
                      val baseName = if (baseFileName.contains(".")) baseFileName.substringBeforeLast(".") else baseFileName
                      val cleanBase = if (baseName.lowercase().endsWith(".pkg")) baseName.substringBeforeLast(".") else baseName

                      var currentOut: OutputStream? = null

                      try {
                          persist(sourceUri, false)
                          persist(treeUri, true)

                          val targetDir = DocumentFile.fromTreeUri(this, treeUri)
                              ?: throw IllegalStateException("Impossible d'accéder au dossier sélectionné")

                          fun createAndOpenPart(): OutputStream {
                              try {
                                  currentOut?.flush()
                                  currentOut?.close()
                              } catch (_: Exception) {}

                              val partName = "$cleanBase.${String.format(Locale.US, "%02d", partIndex)}"
                              log("Création de la partie $partIndex : $partName")

                              val newFile = targetDir.createFile("application/octet-stream", partName)
                                  ?: throw IllegalStateException("Création de $partName échouée")

                              val os = contentResolver.openOutputStream(newFile.uri)
                                  ?: throw IllegalStateException("Ouverture du flux d'écriture impossible pour $partName")
                              
                              partIndex++
                              val stream = BufferedOutputStream(os, 1 shl 20)
                              currentOut = stream
                              return stream
                          }

                          var currentStream = createAndOpenPart()

                          val inputStream = contentResolver.openInputStream(sourceUri)
                              ?: throw IllegalStateException("Impossible d'ouvrir le fichier source en lecture")

                          BufferedInputStream(inputStream, 1 shl 20).use { input ->
                              log("Flux source ouvert. Écriture active...")
                              val buf = ByteArray(1 shl 20)
                              var bytesInCurrentPart = 0L
                              var lastYieldTime = System.currentTimeMillis()

                              while (!cancelled) {
                                  val read = input.read(buf)
                                  if (read <= 0) break

                                  var offset = 0
                                  while (offset < read && !cancelled) {
                                      if (bytesInCurrentPart >= maxPartSize) {
                                          currentStream = createAndOpenPart()
                                          bytesInCurrentPart = 0L
                                      }

                                      val toWrite = minOf(read - offset, (maxPartSize - bytesInCurrentPart).toInt())
                                      currentStream.write(buf, offset, toWrite)
                                      
                                      offset += toWrite
                                      bytesInCurrentPart += toWrite
                                      done += toWrite

                                      val now = System.currentTimeMillis()
                                      if (now - lastYieldTime > 150) {
                                          lastYieldTime = now
                                          val pct = if (total > 0) (done * 100 / total).toInt() else 0
                                          ui.post {
                                              bar.progress = pct * 10
                                              statusView.text = "${fmt(done)} / ${fmt(total)} ($pct%)"
                                          }
                                      }
                                  }
                              }
                          }

                          currentOut?.flush()
                          currentOut?.close()
                          if (!cancelled) {
                              success = true
                              log("Découpage terminé avec succès !")
                          } else {
                              log("Découpage annulé par l'utilisateur.")
                          }
                      } catch (e: Throwable) {
                          log("❌ ERREUR Découpage : ${e.message}")
                      } finally {
                          try {
                              currentOut?.close()
                          } catch (_: Exception) {}
                      }

                      ui.post {
                          processing = false
                          doneUi()
                          if (success) {
                              bar.progress = 1000
                              statusView.text = "Découpage réussi !"
                              triggerSuccessReward()
                          } else if (cancelled) {
                              statusView.text = "Annulé."
                          } else {
                              statusView.text = "Échec du découpage"
                          }
                      }
                  }.start()
              }

              private fun mergePkg() {
                  val out = output ?: return
                  val list = order().map { uris[it] }
                  processing = true
                  cancelled = false
                  goBtnLayout.isEnabled = false
                  cancelBtnLayout.isEnabled = true
                  rewardChestView?.visibility = View.GONE
                  bar.progress = 0
                  statusView.text = "Fusion en cours…"
                  log("=== DÉBUT DE LA FUSION ===")

                  Thread {
                      val total = list.sumOf { size(it) }
                      val sha256 = MessageDigest.getInstance("SHA-256")
                      var done = 0.toLong()
                      var lastPush = 0.toLong()
                      var success = false
                      val t0 = System.currentTimeMillis()

                      try {
                          val pfd = contentResolver.openFileDescriptor(out, "w")
                              ?: throw IllegalStateException("Ouverture sortie impossible")
                          try {
                              val os = BufferedOutputStream(FileOutputStream(pfd.fileDescriptor), 1 shl 20)
                              val buf = ByteArray(1 shl 20)
                              var bytesRead = 0
                              for (u in list) {
                                  if (cancelled) throw InterruptedException("Annulé.")
                                  log("Fusion de la partie : ${getFileName(u)}")
                                  
                                  contentResolver.openFileDescriptor(u, "r")?.use { pfdIn ->
                                      FileInputStream(pfdIn.fileDescriptor).use { input ->
                                          while (true) {
                                              if (cancelled) throw InterruptedException("Annulé.")
                                              bytesRead = input.read(buf)
                                              if (bytesRead <= 0) break
                                              os.write(buf, 0, bytesRead)
                                              sha256.update(buf, 0, bytesRead)
                                              done += bytesRead.toLong()
                                              
                                              val now = System.currentTimeMillis()
                                              if (now - lastPush > 250) {
                                                  lastPush = now
                                                  val elapsedSecs = (now - t0) / 1000.0
                                                  val speedBps = if (elapsedSecs > 0) done / elapsedSecs else 0.0
                                                  val speedStr = fmt(speedBps.toLong()) + "/s"
                                                  val remainingSecs = if (speedBps > 0) ((total - done) / speedBps).toLong() else 0.toLong()
                                                  val remStr = String.format("%02d:%02d", remainingSecs / 60, remainingSecs % 60)
                                                  
                                                  val pct = if (total > 0.toLong()) (done * 100 / total).toInt() else 0
                                                  val msg = "${fmt(done)} / ${fmt(total)} ($speedStr, Reste $remStr)"
                                                  
                                                  ui.post {
                                                      bar.progress = pct * 10
                                                      statusView.text = msg
                                                  }
                                                  if (now - lastNotifTime > 2000 || pct == 100) {
                                                      lastNotifTime = now
                                                      updateProgressNotif("Fusion : $pct%", pct)
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                              os.flush()
                          } finally {
                              pfd.close()
                          }

                          if (verifyBox.isChecked && !cancelled) {
                              ui.post { statusView.text = "Vérification intégrité…" }
                              log("Vérification SHA-256 du fichier fusionné...")
                              val verifyDigest = MessageDigest.getInstance("SHA-256")
                              contentResolver.openFileDescriptor(out, "r")?.use { pfdVerify ->
                                  FileInputStream(pfdVerify.fileDescriptor).use { verifyInput ->
                                      val verifyBuf = ByteArray(1 shl 20)
                                      while (true) {
                                          if (cancelled) throw InterruptedException("Annulé.")
                                          val r = verifyInput.read(verifyBuf)
                                          if (r <= 0) break
                                          verifyDigest.update(verifyBuf, 0, r)
                                      }
                                  }
                              }
                          }
                          success = true
                          log("Fusion et vérification terminées avec succès.")
                      } catch (e: Throwable) {
                          log("❌ ERREUR Fusion : ${e.message}")
                          ui.post {
                              statusView.text = "Erreur : ${e.message}"
                              showResultNotif("PS PKG Manager", "Échec : ${e.message}")
                              processing = false
                              doneUi()
                          }
                          return@Thread
                      }

                      if (!success) {
                          processing = false
                          return@Thread
                      }

                      val h256 = hex(sha256.digest())
                      val secs = (System.currentTimeMillis() - t0) / 1000

                      ui.post {
                          bar.progress = 1000
                          lastHash = h256
                          copyBtnLayout.isEnabled = true
                          hashView.text = "SHA-256 : $h256"
                          statusView.text = "Terminé avec succès en ${secs}s"
                          showResultNotif("PS PKG Manager", "Fusion réussie en ${secs}s !")
                          processing = false
                          doneUi()
                          triggerSuccessReward()
                      }
                  }.start()
              }

              private fun doneUi() {
                  goBtnLayout.isEnabled = true
                  cancelBtnLayout.isEnabled = false
              }

              private fun copyHash() {
                  val h = lastHash ?: return
                  getSystemService(ClipboardManager::class.java).setPrimaryClip(ClipData.newPlainText("sha256", h))
                  toast("SHA-256 copié")
                  log("SHA-256 copié dans le presse-papier.")
              }

              private fun size(u: Uri): Long {
                  return try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.SIZE)
                          if (c.moveToFirst() && i >= 0 && !c.isNull(i)) c.getLong(i) else 0.toLong()
                      } ?: 0.toLong()
                  } catch (_: Exception) { 0.toLong() }
              }

              private fun hex(b: ByteArray): String = b.joinToString("") { "%02x".format(it) }

              private fun fmt(b: Long): String {
                  if (b <= 0.toLong()) return "0 o"
                  val u = arrayOf("o", "Ko", "Mo", "Go", "To")
                  var v = b.toDouble()
                  var i = 0
                  while (v >= 1024 && i < u.size - 1) { v /= 1024; i++ }
                  return if (i == 0) "$b o" else String.format(Locale.US, "%.2f %s", v, u[i])
              }

              private val chunk = Regex("(\\d+|\\D+)")
              private fun naturalCompare(a: String, b: String): Int {
                  val ca = chunk.findAll(a).map { it.value }.toList()
                  val cb = chunk.findAll(b).map { it.value }.toList()
                  for (i in 0 until minOf(ca.size, cb.size)) {
                      val x = ca[i]
                      val y = cb[i]
                      val dx = x[0].isDigit()
                      val dy = y[0].isDigit()
                      val c = when {
                          dx && dy -> {
                              val xs = x.trimStart('0').ifEmpty { "0" }
                              val ys = y.trimStart('0').ifEmpty { "0" }
                              if (xs.length != ys.length) xs.length - ys.length else xs.compareTo(ys)
                          }
                          dx != dy -> if (dx) 1 else -1
                          else -> x.compareTo(y, ignoreCase = true)
                      }
                      if (c != 0) return c
                  }
                  return ca.size - cb.size
              }

              private fun suggestName(): String {
                  if (names.isEmpty()) return "merged"
                  val first = names.minWithOrNull { a, b -> naturalCompare(a, b) } ?: return "merged"
                  val m = Regex("^(.*?)[._\\- ]?(?:part)?[._\\- ]?(\\d+)$", RegexOption.IGNORE_CASE).find(first)
                  var base = m?.groupValues?.get(1)?.trimEnd('.', '_', '-', ' ') ?: first
                  if (base.lowercase().endsWith(".pkg")) base = base.substringBeforeLast(".")
                  return base
              }
          }
          EOF

      - name: Préparer la clé de signature permanente
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p app
          if [ -n "$SIGNING_KEY" ]; then
            echo "Décodage de la clé permanente..."
            echo "$SIGNING_KEY" | base64 --decode > app/release.jks
          else
            echo "Erreur : Le secret SIGNING_KEY est introuvable !"
            exit 1
          fi

      - name: Build APK Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          gradle clean assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEYSTORE_PASSWORD}"

      - name: Renommer l'APK v2.9.67
        run: cp app/build/outputs/apk/release/app-release.apk PkgMerger-v2.9.67.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pkg-merger-v2.9.67-apk
          path: PkgMerger-v2.9.67.apk
          if-no-files-found: error
