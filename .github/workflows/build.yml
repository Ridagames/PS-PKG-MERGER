name: Build PS3 homebrew

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      commit_sources:
        description: "Ecrire les sources generees dans le depot"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ps3-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PS3DEV: /usr/local/ps3dev
  PSL1GHT: /usr/local/ps3dev

jobs:
  build:
    name: Generer et compiler
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest
      options: --user root
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparer la toolchain
        run: |
          set -eo pipefail
          export PSL1GHT="${PSL1GHT:-/usr/local/ps3dev}"
          export PS3DEV="${PS3DEV:-/usr/local/ps3dev}"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"
          echo "PS3DEV=$PS3DEV"   >> "$GITHUB_ENV"

          command -v ppu-gcc >/dev/null || { echo "::error::ppu-gcc introuvable"; exit 1; }
          echo "Toolchain OK"

      - name: Generer le code source
        run: |
          set -eo pipefail
          rm -rf source assets Makefile pkg_build

          cat << 'MAIN_C' > main.c
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <sys/process.h>
          #include <sysutil/sysutil.h>

          SYS_PROCESS_PARAM(1001, 0x20000)

          #define LV2_SYSCALL_LV2_PEEK 8

          static inline uint64_t lv2_peek(uint64_t addr)
          {
              register uint64_t r3  __asm__("3")  = addr;
              register uint64_t r11 __asm__("11") = LV2_SYSCALL_LV2_PEEK;
              __asm__ volatile("sc"
                  : "+r"(r3)
                  : "r"(r11)
                  : "4","5","6","7","8","9","10","12","memory");
              return r3;
          }

          int main(int argc, char **argv)
          {
              (void)argc; (void)argv;
              printf("PS3 Kernel Reader - Actif !\n");

              uint64_t val = lv2_peek(0x8000000000000000ULL);
              printf("Peek 0x8000... : 0x%016llX\n", (unsigned long long)val);
              fflush(stdout);

              for (;;) {
                  sysUtilCheckCallback();
                  usleep(16000);
              }
              return 0;
          }
          MAIN_C

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > ICON0.PNG
          cp ICON0.PNG PIC1.PNG

      - name: Compiler et empaqueter en .pkg
        run: |
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          set -eo pipefail

          echo "1. Compilation de main.c..."
          ppu-gcc -O2 -Wall -I/usr/local/ps3dev/ppu/include -c main.c -o main.o

          echo "2. Edition des liens..."
          ppu-gcc -L/usr/local/ps3dev/ppu/lib main.o -lio -lsysutil -llv2 -lm -o ps3_kernel_reader.elf

          echo "3. Generation du fichier SELF..."
          make_self_npdrm ps3_kernel_reader.elf EBOOT.BIN UP0001-KRNLRDR01_00-0000000000000000

          echo "4. Utilisation du Makefile natif de PSL1GHT pour un package correct..."
          cat << 'EOF' > Makefile
          TARGET    := ps3_kernel_reader
          TITLE     := PS3 Kernel Reader
          APPID     := KRNLRDR01
          CONTENTID := UP0001-$(APPID)_00-0000000000000000
          ICON0     := ICON0.PNG
          PIC1      := PIC1.PNG
          SOURCES   := .
          BUILD     := .
          PSL1GHT   ?= /usr/local/ps3dev
          include $(PSL1GHT)/ppu_rules
          EOF

          # Nettoyage et compilation propre via les regles officielles du SDK
          make clean || true
          make
          make pkg

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ps3-kernel-reader
          if-no-files-found: error
          retention-days: 30
          path: |
            *.pkg
            *.self
            *.elf

      - name: Ecrire les sources dans le depot
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.commit_sources) }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "chore: generation automatique du projet homebrew [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
