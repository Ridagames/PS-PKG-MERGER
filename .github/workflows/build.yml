name: Build PS PKG Merger Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build signed Lite and Full APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Verify Android project
        run: |
          test -f app/src/main/java/com/venice/pkgmerger/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable/logo.png
          test -f app/src/full/res/raw/fn_bg.mp4
          test -f app/src/full/res/raw/gow_bg.mp4
          grep -q 'versionName = "2.1.0"' app/build.gradle.kts

      - name: Restore release signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Missing SIGNING_KEY secret"; exit 1; }
          echo "$SIGNING_KEY" | base64 --decode > app/release.jks
          test -s app/release.jks

      - name: Build both signed release variants
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ALIAS" || { echo "Missing ALIAS secret"; exit 1; }
          gradle clean :app:assembleLiteRelease :app:assembleFullRelease --no-daemon --stacktrace

      - name: Verify and package both APKs
        run: |
          set -e
          LITE="app/build/outputs/apk/lite/release/app-lite-release.apk"
          FULL="app/build/outputs/apk/full/release/app-full-release.apk"
          test -s "$LITE"
          test -s "$FULL"
          mkdir -p dist
          cp "$LITE" dist/PS-PKG-MERGER-v2.1.0-Lite.apk
          cp "$FULL" dist/PS-PKG-MERGER-v2.1.0-Full.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          echo "Lite APK: $(du -h dist/PS-PKG-MERGER-v2.1.0-Lite.apk | cut -f1)"
          echo "Full APK: $(du -h dist/PS-PKG-MERGER-v2.1.0-Full.apk | cut -f1)"

      - name: Upload Lite and Full APKs
        uses: actions/upload-artifact@v4
        with:
          name: PS-PKG-MERGER-v2.1.0-Lite-Full
          path: dist/*
          if-no-files-found: error
          retention-days: 30
