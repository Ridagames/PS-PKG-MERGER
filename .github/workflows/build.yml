                  headerLayout.addView(titlesLayout, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                  menuBtn = Button(this).apply {
                      text = "⚙️ Mode"
                      textSize = 12f
                      setBackgroundDrawable(GradientDrawable().apply {
                          setColor(Color.parseColor("#334155"))
