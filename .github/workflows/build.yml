              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              @SuppressLint("ClickableViewAccessibility")
              private fun styleButton(b: Button, bgHex: String, borderHexStr: String, textHex: String = "#FFFFFF", onClickAction: () -> Unit) {
                  val cfg = getThemeConfig(currentTheme)
                  
                  val normalBg = GradientDrawable().apply {
                      setColor(Color.parseColor(bgHex))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(2), Color.parseColor(borderHexStr))
                  }
                  
                  val pressedBg = GradientDrawable().apply {
                      setColor(Color.parseColor(cfg.pressColor))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(3), Color.WHITE)
                  }

                  b.background = normalBg
                  b.setTextColor(Color.parseColor(textHex))
                  b.setTypeface(null, Typeface.BOLD)
                  b.textSize = 13f
                  b.setPadding(dp(14), dp(12), dp(14), dp(12))

                  val closedChestRes = resources.getIdentifier("fn_chest_closed", "drawable", packageName)
                  val openChestRes = resources.getIdentifier("fn_chest_open", "drawable", packageName)

                  if (currentTheme == "FORTNITE" && closedChestRes != 0) {
                      b.setCompoundDrawablesWithIntrinsicBounds(closedChestRes, 0, 0, 0)
                      b.compoundDrawablePadding = dp(8)
                  } else {
                      b.setCompoundDrawablesWithIntrinsicBounds(0, 0, 0, 0)
                  }

                  b.setOnClickListener {
                      val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      vibrator?.vibrate(VibrationEffect.createOneShot(120, VibrationEffect.DEFAULT_AMPLITUDE))
                      
                      if (currentTheme == "GOW") {
                          playClickSound("gow_click")
                          onClickAction()
                      } else if (currentTheme == "FORTNITE" && openChestRes != 0) {
                          b.setCompoundDrawablesWithIntrinsicBounds(openChestRes, 0, 0, 0)
                          playClickSound("fn_chest_open")
                          Handler(Looper.getMainLooper()).postDelayed({
                              b.setCompoundDrawablesWithIntrinsicBounds(closedChestRes, 0, 0, 0)
                              onClickAction()
                          }, 350)
                      } else {
                          onClickAction()
                      }
                  }

                  b.setOnTouchListener { view, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              view.animate().scaleX(0.95f).scaleY(0.95f).setDuration(60).start()
                              view.background = pressedBg
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              view.animate().scaleX(1.0f).scaleY(1.0f).setDuration(80).start()
                              view.background = normalBg
                          }
                      }
                      false
                  }
              }

              private fun playClickSound(soundName: String) {
                  try {
                      val resId = resources.getIdentifier(soundName, "raw", packageName)
                      if (resId != 0) {
                          clickPlayer?.release()
                          clickPlayer = MediaPlayer.create(this, resId)
                          clickPlayer?.start()
                      }
                  } catch (_: Exception) {}
              }

              private fun setupBackgroundMedia() {
                  try {
                      if (currentTheme == "GOW") {
                          bgVideoView?.visibility = View.VISIBLE
                          val videoResId = resources.getIdentifier("gow_bg", "raw", packageName)
                          if (videoResId != 0 && bgVideoView != null) {
                              val uri = Uri.parse("android.resource://$packageName/$videoResId")
                              bgVideoView?.setVideoURI(uri)
                              bgVideoView?.setOnPreparedListener { mp ->
                                  mp.isLooping = true
                                  mp.setVolume(0f, 0f)
                                  bgVideoView?.setVideoSize(mp.videoWidth, mp.videoHeight)
                                  bgVideoView?.start()
                              }
                          }

                          val musicResId = resources.getIdentifier("gow_music", "raw", packageName)
                          if (musicResId != 0) {
                              if (musicPlayer == null) {
                                  musicPlayer = MediaPlayer.create(this, musicResId)
                                  musicPlayer?.isLooping = true
                              }
                              if (musicPlayer?.isPlaying == false) {
                                  musicPlayer?.start()
                              }
                          }
                          stopFortniteBusAnimation()
                      } else if (currentTheme == "FORTNITE") {
                          bgVideoView?.stopPlayback()
                          bgVideoView?.visibility = View.GONE
                          musicPlayer?.pause()
                          startFortniteBusAnimation()
                      } else {
                          bgVideoView?.stopPlayback()
                          bgVideoView?.visibility = View.GONE
                          musicPlayer?.pause()
                          stopFortniteBusAnimation()
                      }
                  } catch (_: Exception) {}
              }

              private fun startFortniteBusAnimation() {
                  stopFortniteBusAnimation()
                  tree1ImageView?.visibility = View.VISIBLE
                  tree2ImageView?.visibility = View.VISIBLE
                  scheduleNextBusRun()
              }

              private fun stopFortniteBusAnimation() {
                  busHandler.removeCallbacksAndMessages(null)
                  busImageView?.visibility = View.GONE
                  tree1ImageView?.visibility = View.GONE
                  tree2ImageView?.visibility = View.GONE
              }

              private fun scheduleNextBusRun() {
                  val delay = 8000L + random.nextInt(10000)
                  busHandler.postDelayed({
                      runFortniteBus()
                  }, delay)
              }

              private fun runFortniteBus() {
                  val bus = busImageView ?: return
                  val screenWidth = resources.displayMetrics.widthPixels.toFloat()
                  val screenHeight = resources.displayMetrics.heightPixels.toFloat()

                  val goRight = random.nextBoolean()
                  val startX = if (goRight) -dp(120).toFloat() else screenWidth + dp(120).toFloat()
                  val endX = if (goRight) screenWidth + dp(120).toFloat() else -dp(120).toFloat()
                  val randomY = dp(50) + random.nextFloat() * (screenHeight * 0.4f)

                  bus.translationY = randomY
                  bus.translationX = startX
                  bus.scaleX = if (goRight) 1f else -1f
                  bus.visibility = View.VISIBLE

                  try {
                      val busSoundRes = resources.getIdentifier("fn_bus", "raw", packageName)
                      if (busSoundRes != 0) {
                          fnBusPlayer?.release()
                          fnBusPlayer = MediaPlayer.create(this, busSoundRes)
                          fnBusPlayer?.start()
                      }
                  } catch (_: Exception) {}

                  bus.animate()
                      .translationX(endX)
                      .setDuration(4500)
                      .withEndAction {
                          bus.visibility = View.GONE
                          scheduleNextBusRun()
                      }
                      .start()
              }

              override fun onResume() {
                  super.onResume()
                  if (currentTheme == "GOW") {
                      bgVideoView?.start()
                      musicPlayer?.start()
                  } else if (currentTheme == "FORTNITE") {
                      startFortniteBusAnimation()
                  }
              }

              override fun onPause() {
                  super.onPause()
                  bgVideoView?.pause()
                  musicPlayer?.pause()
                  stopFortniteBusAnimation()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  musicPlayer?.release()
                  clickPlayer?.release()
                  fnBusPlayer?.release()
                  stopFortniteBusAnimation()
              }

              private fun applyTheme() {
                  val cfg = getThemeConfig(currentTheme)

                  rootFrameLayout.setBackgroundColor(cfg.bg)
                  rootLayout.setBackgroundColor(Color.TRANSPARENT)
                  mainCol.setBackgroundColor(Color.TRANSPARENT)

                  titleView.setTextColor(cfg.primaryText)
                  subtitleView.setTextColor(cfg.secondaryText)
                  subtitleView.text = "UNIVERSE : ${cfg.name.uppercase()}"

                  section1Title.setTextColor(cfg.secondaryText)
                  section2Title.setTextColor(cfg.secondaryText)
                  section3Title.setTextColor(cfg.secondaryText)

                  checkView.setTextColor(cfg.secondaryText)
                  statusView.setTextColor(cfg.primaryText)
                  hashView.setTextColor(cfg.secondaryText)

                  verifyBox.setTextColor(cfg.dim)
                  deleteBox.setTextColor(cfg.dim)
                  outView.setTextColor(cfg.dim)

                  cardViews.forEach { card ->
                      card.background = GradientDrawable().apply {
                          setColor(cfg.card)
                          cornerRadius = dp(8).toFloat()
                          setStroke(dp(2), Color.parseColor(cfg.border))
                      }
                  }

