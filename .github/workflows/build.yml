name: Build Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Réécrire les sources depuis ce workflow"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Générer le projet Android v2.2.0 Cyber FX
        env:
          FORCE: '1'
        run: |
          set -e
          rm -rf app/src/main/kotlin
          rm -rf app/src/main/java
          mkdir -p app/src/main/java/com/venice/pkgmerger
          mkdir -p app/src/main/res/drawable

          write() {
            f="$1"
            echo "  écrit   $f"
            cat > "$f"
          }

          write .gitignore <<'EOF'
          .gradle/
          build/
          local.properties
          *.apk
          *.jks
          *.keystore
          EOF

          write settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PkgMerger"
          include(":app")
          EOF

          write build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          write gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          write app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.venice.pkgmerger"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.venice.pkgmerger"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 220
                  versionName = "2.2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
          }
          EOF

          write app/src/main/res/drawable/ic_app_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#0D0814"
                android:pathData="M16,0h76c8.8,0 16,7.2 16,16v76c0,8.8 -7.2,16 -16,16H16c-8.8,0 -16,-7.2 -16,-16V16C0,7.2 7.2,0 16,0z"/>
            <path
                android:fillColor="#FF007F"
                android:pathData="M54,18c19.9,0 36,16.1 36,36s-16.1,36 -36,36s-36,-16.1 -36,-36S34.1,18 54,18z"
                android:fillAlpha="0.25"/>
            <path
                android:fillColor="#00F0FF"
                android:pathData="M58,32L38,58h14l-4,18l24-30H40L58,32z"/>
          </vector>
          EOF

          write app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:label="PS PKG Cyber Manager"
                  android:icon="@drawable/ic_app_logo"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="PS PKG Cyber Manager">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          write app/src/main/java/com/venice/pkgmerger/MainActivity.kt <<'EOF'
          package com.venice.pkgmerger

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.DocumentsContract
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.PopupMenu
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.BufferedOutputStream
          import java.io.FileOutputStream
          import java.io.OutputStream
          import java.security.MessageDigest
          import java.util.Locale

          class MainActivity : Activity() {

              private val uris = ArrayList<Uri>()
              private val names = ArrayList<String>()
              private val sizes = ArrayList<Long>()

              private var output: Uri? = null
              private var reversed = false
              private var lastHash: String? = null
              private var appMode = "MERGE"
              @Volatile private var processing = false
              @Volatile private var cancelled = false
              private val ui = Handler(Looper.getMainLooper())
              private var lastNotifTime = 0L

              private lateinit var listContainer: LinearLayout
              private lateinit var checkView: TextView
              private lateinit var outView: TextView
              private lateinit var statusView: TextView
              private lateinit var hashView: TextView
              private lateinit var hashField: EditText
              private lateinit var verifyBox: CheckBox
              private lateinit var deleteBox: CheckBox
              private lateinit var bar: ProgressBar
              private lateinit var pickBtn: Button
              private lateinit var dirBtn: Button
              private lateinit var outBtn: Button
              private lateinit var goBtn: Button
              private lateinit var cancelBtn: Button
              private lateinit var revBtn: Button
              private lateinit var copyBtn: Button
              private lateinit var menuBtn: Button
              private lateinit var titleView: TextView
              private lateinit var subtitleView: TextView
              private lateinit var section1Title: TextView
              private lateinit var pkgIconView: ImageView
              private lateinit var infoLayout: LinearLayout

              private val cyanNeon = Color.parseColor("#00F0FF")
              private val pinkNeon = Color.parseColor("#FF007F")
              private val bgDark = Color.parseColor("#0D0814")
              private val cardCyber = Color.parseColor("#170F26")
              private val borderCyber = "#FF007F"
              private val dimText = Color.parseColor("#A899C2")

              private val NOTIF_ID_PROGRESS = 101
              private val NOTIF_ID_RESULT = 102

              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  createNotificationChannel()
                  checkPermissions()
                  showMergerScreen()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              @SuppressLint("ClickableViewAccessibility")
              private fun styleCyberButton(b: Button, bgHex: String, borderHexStr: String = "#00F0FF", textHex: String = "#FFFFFF") {
                  val normalBg = GradientDrawable().apply {
                      setColor(Color.parseColor(bgHex))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(2), Color.parseColor(borderHexStr))
                  }
                  
                  val pressedBg = GradientDrawable().apply {
                      setColor(Color.parseColor(borderHexStr))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(2), Color.WHITE)
                  }

                  b.background = normalBg
                  b.setTextColor(Color.parseColor(textHex))
                  b.setTypeface(null, Typeface.BOLD)
                  b.textSize = 13f
                  b.setPadding(dp(14), dp(12), dp(14), dp(12))

                  b.setOnTouchListener { view, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              view.animate().scaleX(0.95f).scaleY(0.95f).setDuration(80).start()
                              view.background = pressedBg
                              b.setTextColor(Color.BLACK)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              view.animate().scaleX(1.0f).scaleY(1.0f).setDuration(120).start()
                              view.background = normalBg
                              b.setTextColor(Color.parseColor(textHex))
                          }
                      }
                      false
                  }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "pkg_channel",
                          "PS PKG Notifications",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply { description = "Progression des traitements PKG" }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 100)
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun updateProgressNotif(msg: String, pct: Int) {
                  try {
                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle("⚡ PS PKG Cyber Manager")
                          .setContentText(msg)
                          .setSmallIcon(android.R.drawable.ic_menu_save)
                          .setProgress(100, pct, false)
                          .setOngoing(true)
                          .build()

                      getSystemService(NotificationManager::class.java).notify(NOTIF_ID_PROGRESS, notification)
                  } catch (_: Exception) {}
              }

              private fun showResultNotif(title: String, message: String) {
                  try {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.cancel(NOTIF_ID_PROGRESS)

                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle(title)
                          .setContentText(message)
                          .setSmallIcon(android.R.drawable.ic_menu_save)
                          .setAutoCancel(true)
                          .build()

                      nm.notify(NOTIF_ID_RESULT, notification)
                  } catch (_: Exception) {}
              }

              private fun showMergerScreen() {
                  val pad = dp(16)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                      setBackgroundColor(bgDark)
                  }

                  val headerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(4), 0, dp(14))
                  }
                  
                  val titlesLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  titleView = TextView(this).apply {
                      text = "⚡ CYBER PKG MANAGER"
                      textSize = 22f
                      setTextColor(pinkNeon)
                      setTypeface(null, Typeface.BOLD)
                  }
                  titlesLayout.addView(titleView)
                  
                  subtitleView = TextView(this).apply {
                      text = "ENGINE v2.2.0 • PS3/PS4/PS5 FX TOOLKIT"
                      textSize = 10f
                      setTextColor(cyanNeon)
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(2), 0, 0)
                  }
                  titlesLayout.addView(subtitleView)
                  headerLayout.addView(titlesLayout, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                  menuBtn = Button(this).apply {
                      text = "⚙️ MODE"
                      styleCyberButton(this, "#2A1845", "#FF007F", "#00F0FF")
                      setOnClickListener { showMenu(it) }
                  }
                  headerLayout.addView(menuBtn, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { gravity = Gravity.CENTER_VERTICAL })
                  col.addView(headerLayout)

                  val card1 = createCard()
                  section1Title = text("1. SOURCE FILES (PKG / PARTS)", 13f, cyanNeon, true).apply { typeface = Typeface.MONOSPACE }
                  card1.addView(section1Title)
                  
                  pickBtn = Button(this).apply {
                      text = "📁 CHOISIR LES FICHIERS"
                      styleCyberButton(this, "#182045", "#00F0FF")
                      setOnClickListener {
                          if (processing) { toast("⚠️ Traitement en cours !"); return@setOnClickListener }
                          pick()
                      }
                  }
                  card1.addView(pickBtn, lp())

                  dirBtn = Button(this).apply {
                      text = "📂 CHOISIR UN DOSSIER COMPLET"
                      styleCyberButton(this, "#182045", "#00F0FF")
                      setOnClickListener {
                          if (processing) { toast("⚠️ Traitement en cours !"); return@setOnClickListener }
                          pickFolder()
                      }
                  }
                  card1.addView(dirBtn, lp())

                  revBtn = Button(this).apply {
                      text = "🔀 INVERSER L'ORDRE DES PARTIES"
                      styleCyberButton(this, "#2A1845", "#FF007F")
                      setOnClickListener {
                          if (processing) { toast("⚠️ Traitement en cours !"); return@setOnClickListener }
                          reversed = !reversed; refresh()
                      }
                  }
                  card1.addView(revBtn, lp())

                  listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(8), 0, dp(4))
                  }
                  card1.addView(listContainer, lp())

                  infoLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(8), 0, dp(4))
                  }

                  pkgIconView = ImageView(this).apply {
                      visibility = GONE
                      adjustViewBounds = true
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#0D0814"))
                          cornerRadius = dp(8).toFloat()
                          setStroke(dp(1), Color.parseColor("#00F0FF"))
                      }
                  }
                  infoLayout.addView(pkgIconView, LinearLayout.LayoutParams(dp(64), dp(64)).apply { rightMargin = dp(12) })

                  checkView = text("", 11f, cyanNeon).apply { typeface = Typeface.MONOSPACE }
                  infoLayout.addView(checkView, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  
                  card1.addView(infoLayout, lp())
                  col.addView(card1, lpCard())

                  val card2 = createCard()
                  card2.addView(text("2. OUTPUT & PROCESSING", 13f, cyanNeon, true).apply { typeface = Typeface.MONOSPACE })

                  outBtn = Button(this).apply {
                      text = "💾 DÉFINIR EMPLACEMENT DE SORTIE"
                      styleCyberButton(this, "#0D3838", "#00F0FF")
                      setOnClickListener {
                          if (processing) { toast("⚠️ Traitement en cours !"); return@setOnClickListener }
                          pickOutput()
                      }
                  }
                  card2.addView(outBtn, lp())

                  outView = text("Sortie : —", 11f, dimText).apply { 
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(6), 0, dp(8))
                  }
                  card2.addView(outView, lp())

                  val actionLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  goBtn = Button(this).apply {
                      text = "▶️ LANCER LA FUSION"
                      styleCyberButton(this, "#0F4D2A", "#00FF66")
                      setOnClickListener { executeAction() }
                  }
                  actionLayout.addView(goBtn, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                  cancelBtn = Button(this).apply {
                      text = "❌ ANNULER"
                      styleCyberButton(this, "#4D0F1A", "#FF0055")
                      isEnabled = false
                      setOnClickListener {
                          if (processing) {
                              cancelled = true
                              statusView.text = "Annulation en cours..."
                              toast("Annulation demandée...")
                          }
                      }
                  }
                  actionLayout.addView(cancelBtn, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { leftMargin = dp(8) })
                  card2.addView(actionLayout, lp())

                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 1000
                      progress = 0
                      setPadding(0, dp(12), 0, dp(4))
                  }
                  card2.addView(bar, lp())

                  statusView = text("Prêt.", 13f, pinkNeon).apply { setTypeface(Typeface.MONOSPACE, Typeface.BOLD) }
                  card2.addView(statusView, lp())
                  col.addView(card2, lpCard())

                  val card3 = createCard()
                  card3.addView(text("3. SECURITY & CHECKSUM", 13f, cyanNeon, true).apply { typeface = Typeface.MONOSPACE })

                  verifyBox = CheckBox(this).apply {
                      text = "Contrôle d'intégrité après écriture"
                      isChecked = true
                      setTextColor(dimText)
                      textSize = 12f
                  }
                  card3.addView(verifyBox, lp())

                  deleteBox = CheckBox(this).apply {
                      text = "Supprimer les sources après succès"
                      isChecked = false
                      setTextColor(dimText)
                      textSize = 12f
                  }
                  card3.addView(deleteBox, lp())

                  hashField = EditText(this).apply {
                      hint = "Coller un hash SHA-256 de contrôle"
                      setTextColor(Color.WHITE)
                      setHintTextColor(dimText)
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                  }
                  card3.addView(hashField, lp())

                  hashView = text("", 11f, cyanNeon).apply { typeface = Typeface.MONOSPACE }
                  card3.addView(hashView, lp())

                  copyBtn = Button(this).apply {
                      text = "📋 Copier le SHA-256"
                      styleCyberButton(this, "#2A1845", "#FF007F")
                      isEnabled = false
                      setOnClickListener { copyHash() }
                  }
                  card3.addView(copyBtn, lp())
                  col.addView(card3, lpCard())

                  refresh()

                  setContentView(ScrollView(this).apply { 
                      setBackgroundColor(bgDark)
                      addView(col) 
                  })
              }

              private fun showMenu(v: android.view.View) {
                  if (processing) {
                      toast("⚠️ Traitement en cours !")
                      return
                  }
                  val popup = PopupMenu(this, v)
                  popup.menu.add(0, 1, 0, if (appMode == "MERGE") "📂 Mode Splitter" else "🔗 Mode Fusion")
                  popup.menu.add(0, 2, 1, "ℹ️ À propos")
                  popup.setOnMenuItemClickListener { item ->
                      when (item.itemId) {
                          1 -> {
                              appMode = if (appMode == "MERGE") "SPLIT" else "MERGE"
                              if (appMode == "SPLIT") {
                                  titleView.text = "⚡ CYBER SPLITTER"
                                  subtitleView.text = "DECOUPAGE DES FICHIERS PKG EN BLOCS"
                                  section1Title.text = "1. FICHIER SOURCE UNIQUE (.PKG)"
                                  goBtn.text = "▶️ DÉCOUPER"
                                  statusView.text = "Prêt à découper."
                              } else {
                                  titleView.text = "⚡ CYBER PKG MANAGER"
                                  subtitleView.text = "ENGINE v2.2.0 • PS3/PS4/PS5 FX TOOLKIT"
                                  section1Title.text = "1. SOURCE FILES (PKG / PARTS)"
                                  goBtn.text = "▶️ LANCER LA FUSION"
                                  statusView.text = "Prêt à fusionner."
                              }
                              output = null
                              outView.text = "Sortie : —"
                              true
                          }
                          2 -> {
                              toast("PS PKG Cyber Manager v2.2.0")
                              true
                          }
                          else -> false
                      }
                  }
                  popup.show()
              }

              private fun lp() = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(6) }
              private fun lpCard() = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(12); bottomMargin = dp(4) }

              private fun createCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = GradientDrawable().apply {
                          setColor(cardCyber)
                          cornerRadius = dp(8).toFloat()
                          setStroke(dp(2), Color.parseColor(borderCyber))
                      }
                  }
              }

              private fun text(t: String, size: Float, color: Int, bold: Boolean = false) =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, dp(2), 0, dp(2))
                  }

              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_SHORT).show()

              private fun pick() {
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      }, 1
                  )
              }

              private fun pickFolder() {
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }, 3
                  )
              }

              private fun pickOutput() {
                  if (uris.isEmpty()) {
                      toast("Choisis d'abord les fichiers sources !")
                      return
                  }
                  if (appMode == "SPLIT") {
                      startActivityForResult(
                          Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                              addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }, 4
                      )
                  } else {
                      startActivityForResult(
                          Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "application/octet-stream"
                              putExtra(Intent.EXTRA_TITLE, suggestName())
                          }, 2
                      )
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res != RESULT_OK) return

                  if (req == 1) {
                      uris.clear(); names.clear(); sizes.clear()
                      val clip = data?.clipData
                      if (clip != null) {
                          for (i in 0 until clip.itemCount) {
                              val u = clip.getItemAt(i).uri
                              if (isPkgFile(getFileName(u))) add(u)
                          }
                      } else {
                          data?.data?.let { u -> if (isPkgFile(getFileName(u))) add(u) }
                      }
                      reversed = false
                      refresh()
                  } else if (req == 2) {
                      val u = data?.data ?: return
                      persist(u, true)
                      output = u
                      if (::outView.isInitialized) {
                          outView.text = "Sortie : ${u.lastPathSegment}"
                      }
                  } else if (req == 3) {
                      val tree = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(tree, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (_: Exception) {}
                      loadTree(tree)
                  } else if (req == 4) {
                      val tree = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(tree, Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (_: Exception) {}
                      output = tree
                      if (::outView.isInitialized) {
                          outView.text = "Dossier de sortie : Dossier sélectionné"
                      }
                  }
              }

              private fun isPkgFile(name: String): Boolean {
                  val lower = name.lowercase()
                  return lower.endsWith(".pkg") || lower.contains(".pkg.")
              }

              private fun getFileName(u: Uri): String {
                  var n = "game.pkg"
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (c.moveToFirst() && ni >= 0 && !c.isNull(ni)) c.getString(ni)?.let { if (it.isNotBlank()) n = it }
                      }
                  } catch (_: Exception) {}
                  return n
              }

              private fun loadTree(tree: Uri) {
                  uris.clear(); names.clear(); sizes.clear()
                  try {
                      val docId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId)
                      val cols = arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_SIZE,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      )
                      contentResolver.query(children, cols, null, null, null)?.use { c ->
                          while (c.moveToNext()) {
                              val id = c.getString(0)
                              val name = c.getString(1)
                              val mime = c.getString(3)
                              if (id != null && name != null && mime != DocumentsContract.Document.MIME_TYPE_DIR) {
                                  if (isPkgFile(name)) {
                                      val size = if (c.isNull(2)) 0L else c.getLong(2)
                                      uris.add(DocumentsContract.buildDocumentUriUsingTree(tree, id))
                                      names.add(name)
                                      sizes.add(size)
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      toast("Erreur lecture dossier : ${e.message}")
                  }
                  reversed = false
                  refresh()
                  if (uris.isEmpty()) toast("Aucun fichier .pkg valide trouvé.")
              }

              private fun persist(u: Uri, write: Boolean = false) {
                  try {
                      var f = Intent.FLAG_GRANT_READ_URI_PERMISSION
                      if (write) f = f or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      contentResolver.takePersistableUriPermission(u, f)
                  } catch (_: Exception) {}
              }

              private fun add(u: Uri) {
                  persist(u)
                  var n = getFileName(u)
                  var s = size(u)
                  uris.add(u); names.add(n); sizes.add(s)
              }

              private fun removeAt(index: Int) {
                  if (index in uris.indices) {
                      uris.removeAt(index)
                      names.removeAt(index)
                      sizes.removeAt(index)
                      refresh()
                  }
              }

              private data class PkgInfo(val console: String, val valid: Boolean, val contentId: String, val region: String, val icon: Bitmap? = null)

              private fun analyzePkg(u: Uri): PkgInfo {
                  try {
                      contentResolver.openInputStream(u)?.use { input ->
                          val header = ByteArray(512)
                          val read = input.read(header)
                          if (read < 128) return PkgInfo("Inconnu", false, "", "Inconnue")

                          val isCnt = (header[0] == 0x7F.toByte() && header[1] == 'C'.toByte() && 
                                       header[2] == 'N'.toByte() && header[3] == 'T'.toByte())
                          val isFih = (header[0] == 0x7F.toByte() && header[1] == 'F'.toByte() && 
                                       header[2] == 'I'.toByte() && header[3] == 'H'.toByte())

                          if (!isCnt && !isFih) return PkgInfo("Invalide", false, "", "Inconnue")

                          var contentId = ""
                          for (i in 48 until 200) {
                              val b = header[i]
                              if (b in 32..126) {
                                  contentId += b.toChar()
                              } else {
                                  if (contentId.length >= 20 && contentId.contains("-")) break
                                  contentId = ""
                              }
                          }

                          val region = when {
                              contentId.startsWith("EP", true) || contentId.startsWith("BP", true) -> "🇪🇺 Europe (EP/BP)"
                              contentId.startsWith("UP", true) || contentId.startsWith("HP", true) -> "🇺🇸 US (UP/HP)"
                              contentId.startsWith("JP", true) || contentId.startsWith("AP", true) -> "🇯🇵 / Asie (JP/AP)"
                              else -> "Inconnue"
                          }

                          val name = getFileName(u).lowercase()
                          val console = when {
                              name.contains("ps3") || name.contains("nplb") -> "PS3"
                              name.contains("ps4") || name.contains("cusa") -> "PS4"
                              name.contains("ps5") || name.contains("ppsa") || isFih -> "PS5"
                              else -> "PS5/PS4"
                          }

                          var iconBitmap: Bitmap? = null
                          try {
                              val iconBuf = ByteArray(64 * 1024)
                              val iconRead = input.read(iconBuf)
                              if (iconRead > 0) {
                                  for (i in 0 until iconRead - 8) {
                                      if (iconBuf[i] == 0x89.toByte() && iconBuf[i+1] == 'P'.toByte() &&
                                          iconBuf[i+2] == 'N'.toByte() && iconBuf[i+3] == 'G'.toByte()) {
                                          iconBitmap = BitmapFactory.decodeByteArray(iconBuf, i, iconRead - i)
                                          break
                                      }
                                  }
                              }
                          } catch (_: Exception) {}

                          return PkgInfo(console, true, contentId.trim(), region, iconBitmap)
                      }
                  } catch (_: Exception) {}
                  return PkgInfo("Invalide", false, "", "Inconnue")
              }

              private fun refresh() {
                  if (!::listContainer.isInitialized) return
                  listContainer.removeAllViews()

                  if (uris.isEmpty()) {
                      listContainer.addView(text("NO FILES SELECTED", 11f, dimText).apply { typeface = Typeface.MONOSPACE })
                      checkView.text = ""
                      pkgIconView.visibility = GONE
                      return
                  }

                  val order = order()
                  val total = order.sumOf { sizes[it] }
                  val info = analyzePkg(uris[order[0]])

                  val summaryView = text("${order.size} parte(s) • ${fmt(total)} • Ordre ${if (reversed) "inversé" else "croissant"}", 12f, pinkNeon, true).apply { typeface = Typeface.MONOSPACE }
                  listContainer.addView(summaryView)

                  order.forEachIndexed { i, idx ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          setPadding(dp(12), dp(8), dp(12), dp(8))
                          gravity = Gravity.CENTER_VERTICAL
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor("#0D0814"))
                              cornerRadius = dp(4).toFloat()
                              setStroke(dp(1), Color.parseColor("#00F0FF"))
                          }
                      }

                      val itemText = TextView(this).apply {
                          text = "[${i + 1}] ${names[idx]}\n↳ ${fmt(sizes[idx])}"
                          textSize = 11f
                          setTextColor(Color.WHITE)
                          typeface = Typeface.MONOSPACE
                      }
                      row.addView(itemText, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                      val deleteBtn = Button(this).apply {
                          text = "🚫"
                          textSize = 12f
                          setBackgroundColor(Color.TRANSPARENT)
                          setOnClickListener {
                              if (processing) { toast("⚠️ Traitement en cours !"); return@setOnClickListener }
                              removeAt(idx)
                          }
                      }
                      row.addView(deleteBtn, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))

                      val marginLp = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply {
                          topMargin = dp(4)
                          bottomMargin = dp(4)
                      }
                      listContainer.addView(row, marginLp)
                  }

                  if (info.icon != null) {
                      pkgIconView.setImageBitmap(info.icon)
                      pkgIconView.visibility = VISIBLE
                  } else {
                      pkgIconView.visibility = GONE
                  }

                  checkView.text = if (info.valid) {
                      buildString {
                          append("► PKG ").append(info.console).append(" DETECTED\n")
                          if (info.contentId.isNotEmpty()) append("• CID: ").append(info.contentId).append("\n")
                          append("• REGION: ").append(info.region)
                      }
                  } else {
                      "⚠️ INVALID PKG HEADER"
                  }
              }

              private fun order(): List<Int> {
                  val o = uris.indices.sortedWith { a, b -> naturalCompare(names[a], names[b]) }
                  return if (reversed) o.reversed() else o
              }

              private fun executeAction() {
                  if (uris.isEmpty()) { toast("Sélectionne d'abord des fichiers."); return }
                  val info = analyzePkg(uris[0])
                  if (!info.valid) {
                      toast("Erreur : En-tête PKG invalide !")
                      statusView.text = "Erreur : En-tête PKG invalide !"
                      return
                  }

                  if (appMode == "SPLIT") {
                      splitPkg()
                  } else {
                      mergePkg()
                  }
              }

              private fun splitPkg() {
                  val treeUri = output
                  if (treeUri == null) { toast("Choisis d'abord le dossier de sortie."); return }

                  val sourceUri = uris[0]
                  var sourceName = getFileName(sourceUri)
                  if (sourceName.isBlank() || sourceName == "game.pkg") {
                      sourceName = "pkg_game.pkg"
                  }
                  val info = analyzePkg(sourceUri)
                  if (!info.valid) {
                      toast("Erreur : En-tête PKG invalide !")
                      return
                  }

                  processing = true
                  cancelled = false
                  goBtn.isEnabled = false
                  cancelBtn.isEnabled = true
                  bar.progress = 0
                  statusView.text = "Découpage ${info.console} en cours…"

                  Thread {
                      val total = size(sourceUri)
                      var done = 0L
                      var lastPush = 0L
                      var success = false
                      val t0 = System.currentTimeMillis()
                      val sha256 = if (verifyBox.isChecked) MessageDigest.getInstance("SHA-256") else null

                      try {
                          val maxPartSize = 4L * 1024L * 1024L * 1024L
                          var partIndex = 0
                          val treeDocId = DocumentsContract.getTreeDocumentId(treeUri)
                          val baseDirUri = DocumentsContract.buildDocumentUriUsingTree(treeUri, treeDocId)
                          var currentOutputStream: OutputStream? = null

                          fun openNextPart() {
                              try { currentOutputStream?.flush(); currentOutputStream?.close() } catch (_: Exception) {}

                              val partName = "$sourceName.${String.format(Locale.US, "%02d", partIndex)}"
                              val docUri = DocumentsContract.createDocument(contentResolver, baseDirUri, "application/octet-stream", partName)
                                  ?: throw IllegalStateException("Création de $partName impossible")
                              
                              currentOutputStream = BufferedOutputStream(contentResolver.openOutputStream(docUri)
                                  ?: throw IllegalStateException("Ouverture du flux écriture impossible"), 1 shl 20)
                              partIndex++
                          }

                          openNextPart()

                          val buf = ByteArray(1 shl 20)
                          var currentPartBytes = 0L
                          contentResolver.openInputStream(sourceUri)?.use { input ->
                              while (true) {
                                  if (cancelled) throw InterruptedException("Annulé par l'utilisateur.")
                                  val bytesRead = input.read(buf)
                                  if (bytesRead <= 0) break

                                  var offset = 0
                                  while (offset < bytesRead) {
                                      if (cancelled) throw InterruptedException("Annulé par l'utilisateur.")
                                      if (currentPartBytes >= maxPartSize) {
                                          openNextPart()
                                          currentPartBytes = 0L
                                      }
                                      val chunkToWrite = minOf(bytesRead - offset, (maxPartSize - currentPartBytes).toInt())
                                      currentOutputStream!!.write(buf, offset, chunkToWrite)
                                      sha256?.update(buf, offset, chunkToWrite)
                                      offset += chunkToWrite
                                      currentPartBytes += chunkToWrite
                                      done += chunkToWrite

                                      val now = System.currentTimeMillis()
                                      if (now - lastPush > 250) {
                                          lastPush = now
                                          val elapsedSecs = (now - t0) / 1000.0
                                          val speedBps = if (elapsedSecs > 0) done / elapsedSecs else 0.0
                                          val speedStr = fmt(speedBps.toLong()) + "/s"
                                          val remainingSecs = if (speedBps > 0) ((total - done) / speedBps).toLong() else 0L
                                          val remStr = String.format("%02d:%02d", remainingSecs / 60, remainingSecs % 60)
                                          
                                          val pct = if (total > 0) (done * 100 / total).toInt() else 0
                                          val msg = "${fmt(done)} / ${fmt(total)} ($speedStr, Reste $remStr)"
                                          
                                          ui.post {
                                              bar.progress = pct * 10
                                              statusView.text = msg
                                          }
                                          if (now - lastNotifTime > 2000 || pct == 100) {
                                              lastNotifTime = now
                                              updateProgressNotif("Découpage : $pct%", pct)
                                          }
                                      }
                                  }
                              }
                          }
                          try { currentOutputStream?.flush(); currentOutputStream?.close() } catch (_: Exception) {}
                          success = true
                      } catch (e: Throwable) {
                          ui.post {
                              statusView.text = "Erreur : ${e.message}"
                              showResultNotif("PS PKG Manager", "Échec : ${e.message}")
                              processing = false
                              doneUi()
                          }
                          return@Thread
                      }

                      if (!success) {
                          processing = false
                          return@Thread
                      }

                      val h256 = sha256?.let { hex(it.digest()) }
                      val secs = (System.currentTimeMillis() - t0) / 1000

                      ui.post {
                          bar.progress = 1000
                          lastHash = h256
                          copyBtn.isEnabled = h256 != null
                          if (h256 != null) {
                              hashView.text = "SHA-256 : $h256"
                          }
                          statusView.text = "Découpage réussi en ${secs}s !"
                          showResultNotif("PS PKG Manager", "Découpage terminé en ${secs}s !")
                          processing = false
                          doneUi()
                      }
                  }.start()
              }

              private fun mergePkg() {
                  if (uris.size < 2) { toast("Sélectionne au moins 2 parties."); return }
                  val out = output
                  if (out == null) { toast("Choisis d'abord le fichier de sortie."); return }

                  val list = order().map { uris[it] }
                  val info = analyzePkg(list[0])
                  if (!info.valid) {
                      toast("Erreur : En-tête PKG invalide !")
                      return
                  }

                  processing = true
                  cancelled = false
                  goBtn.isEnabled = false
                  cancelBtn.isEnabled = true
                  bar.progress = 0
                  statusView.text = "Fusion ${info.console} en cours…"

                  Thread {
                      val total = list.sumOf { size(it) }
                      val sha256 = MessageDigest.getInstance("SHA-256")
                      var done = 0L
                      var lastPush = 0L
                      var success = false
                      val t0 = System.currentTimeMillis()

                      try {
                          val pfd = contentResolver.openFileDescriptor(out, "w")
                              ?: throw IllegalStateException("Ouverture sortie impossible")
                          try {
                              val os = BufferedOutputStream(FileOutputStream(pfd.fileDescriptor), 1 shl 20)
                              val buf = ByteArray(1 shl 20)
                              var bytesRead: Int
                              for (u in list) {
                                  if (cancelled) throw InterruptedException("Annulé.")
                                  contentResolver.openInputStream(u)?.use { input ->
                                      while (true) {
                                          if (cancelled) throw InterruptedException("Annulé.")
                                          bytesRead = input.read(buf)
                                          if (bytesRead <= 0) break
                                          os.write(buf, 0, bytesRead)
                                          sha256.update(buf, 0, bytesRead)
                                          done += bytesRead
                                          
                                          val now = System.currentTimeMillis()
                                          if (now - lastPush > 250) {
                                              lastPush = now
                                              val elapsedSecs = (now - t0) / 1000.0
                                              val speedBps = if (elapsedSecs > 0) done / elapsedSecs else 0.0
                                              val speedStr = fmt(speedBps.toLong()) + "/s"
                                              val remainingSecs = if (speedBps > 0) ((total - done) / speedBps).toLong() else 0L
                                              val remStr = String.format("%02d:%02d", remainingSecs / 60, remainingSecs % 60)
                                              
                                              val pct = if (total > 0) (done * 100 / total).toInt() else 0
                                              val msg = "${fmt(done)} / ${fmt(total)} ($speedStr, Reste $remStr)"
                                              
                                              ui.post {
                                                  bar.progress = pct * 10
                                                  statusView.text = msg
                                              }
                                              if (now - lastNotifTime > 2000 || pct == 100) {
                                                  lastNotifTime = now
                                                  updateProgressNotif("Fusion : $pct%", pct)
                                              }
                                          }
                                      }
                                  }
                              }
                              os.flush()
                          } finally {
                              pfd.close()
                          }

                          if (verifyBox.isChecked && !cancelled) {
                              ui.post { statusView.text = "Vérification intégrité…" }
                              val verifyDigest = MessageDigest.getInstance("SHA-256")
                              contentResolver.openInputStream(out)?.use { verifyInput ->
                                  val verifyBuf = ByteArray(1 shl 20)
                                  while (true) {
                                      if (cancelled) throw InterruptedException("Annulé.")
                                      val r = verifyInput.read(verifyBuf)
                                      if (r <= 0) break
                                      verifyDigest.update(verifyBuf, 0, r)
                                  }
                              }
                          }
                          success = true
                      } catch (e: Throwable) {
                          ui.post {
                              statusView.text = "Erreur : ${e.message}"
                              showResultNotif("PS PKG Manager", "Échec : ${e.message}")
                              processing = false
                              doneUi()
                          }
                          return@Thread
                      }

                      if (!success) {
                          processing = false
                          return@Thread
                      }

                      val h256 = hex(sha256.digest())
                      val secs = (System.currentTimeMillis() - t0) / 1000

                      ui.post {
                          bar.progress = 1000
                          lastHash = h256
                          copyBtn.isEnabled = true
                          hashView.text = "SHA-256 : $h256"
                          statusView.text = "Terminé avec succès en ${secs}s"
                          showResultNotif("PS PKG Manager", "Fusion réussie en ${secs}s !")
                          processing = false
                          doneUi()
                      }
                  }.start()
              }

              private fun doneUi() {
                  if (::goBtn.isInitialized) {
                      goBtn.isEnabled = true
                      cancelBtn.isEnabled = false
                  }
              }

              private fun copyHash() {
                  val h = lastHash ?: return
                  getSystemService(ClipboardManager::class.java).setPrimaryClip(ClipData.newPlainText("sha256", h))
                  toast("SHA-256 copié")
              }

              private fun size(u: Uri): Long {
                  return try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.SIZE)
                          if (c.moveToFirst() && i >= 0 && !c.isNull(i)) c.getLong(i) else 0L
                      } ?: 0L
                  } catch (_: Exception) { 0L }
              }

              private fun hex(b: ByteArray): String = b.joinToString("") { "%02x".format(it) }

              private fun fmt(b: Long): String {
                  if (b <= 0) return "0 o"
                  val u = arrayOf("o", "Ko", "Mo", "Go", "To")
                  var v = b.toDouble()
                  var i = 0
                  while (v >= 1024 && i < u.size - 1) { v /= 1024; i++ }
                  return if (i == 0) "$b o" else String.format(Locale.US, "%.2f %s", v, u[i])
              }

              private val chunk = Regex("(\\d+|\\D+)")
              private fun naturalCompare(a: String, b: String): Int {
                  val ca = chunk.findAll(a).map { it.value }.toList()
                  val cb = chunk.findAll(b).map { it.value }.toList()
                  for (i in 0 until minOf(ca.size, cb.size)) {
                      val x = ca[i]
                      val y = cb[i]
                      val dx = x[0].isDigit()
                      val dy = y[0].isDigit()
                      val c = when {
                          dx && dy -> {
                              val xs = x.trimStart('0').ifEmpty { "0" }
                              val ys = y.trimStart('0').ifEmpty { "0" }
                              if (xs.length != ys.length) xs.length - ys.length else xs.compareTo(ys)
                          }
                          dx != dy -> if (dx) 1 else -1
                          else -> x.compareTo(y, ignoreCase = true)
                      }
                      if (c != 0) return c
                  }
                  return ca.size - cb.size
              }

              private fun suggestName(): String {
                  if (names.isEmpty()) return "merged.pkg"
                  val first = names.minWithOrNull { a, b -> naturalCompare(a, b) } ?: return "merged.pkg"
                  val m = Regex("^(.*?)[._\\- ]?(?:part)?[._\\- ]?(\\d+)$", RegexOption.IGNORE_CASE).find(first)
                  var base = m?.groupValues?.get(1)?.trimEnd('.', '_', '-', ' ') ?: first
                  if (base.lowercase().endsWith(".pkg")) return base
                  return "$base.pkg"
              }
          }
          EOF

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK v2.2.0
        run: cp app/build/outputs/apk/debug/app-debug.apk PkgMerger-v2.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pkg-merger-v2.2.0-apk
          path: PkgMerger-v2.2.0.apk
          if-no-files-found: error
