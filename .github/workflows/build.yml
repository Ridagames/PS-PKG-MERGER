name: Build Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Réécrire les sources depuis ce workflow"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Générer le projet Android v2.1.0
        env:
          FORCE: '1'
        run: |
          set -e
          rm -rf app/src/main/kotlin
          rm -f app/src/main/java/com/venice/pkgmerger/PkgManagerHelper.kt
          mkdir -p app/src/main/java/com/venice/pkgmerger
          mkdir -p app/src/main/res/drawable

          write() {
            f="$1"
            echo "  écrit   $f"
            cat > "$f"
          }

          write .gitignore <<'EOF'
          .gradle/
          build/
          local.properties
          *.apk
          *.jks
          *.keystore
          EOF

          write settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PkgMerger"
          include(":app")
          EOF

          write build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          write gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          write app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.venice.pkgmerger"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.venice.pkgmerger"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 210
                  versionName = "2.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
          }
          EOF

          write app/src/main/res/drawable/ic_app_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#0F172A"
                android:pathData="M16,0h76c8.8,0 16,7.2 16,16v76c0,8.8 -7.2,16 -16,16H16c-8.8,0 -16,-7.2 -16,-16V16C0,7.2 7.2,0 16,0z"/>
            <path
                android:fillColor="#38BDF8"
                android:pathData="M54,18c19.9,0 36,16.1 36,36s-16.1,36 -36,36s-36,-16.1 -36,-36S34.1,18 54,18z"
                android:fillAlpha="0.15"/>
            <path
                android:fillColor="#38BDF8"
                android:pathData="M58,32L38,58h14l-4,18l24-30H40L58,32z"/>
          </vector>
          EOF

          write app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:label="PKG Merger Suite"
                  android:icon="@drawable/ic_app_logo"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="PKG Merger Suite">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          write app/src/main/java/com/venice/pkgmerger/MainActivity.kt <<'EOF'
          package com.venice.pkgmerger

          import android.Manifest
          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.DocumentsContract
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.BufferedOutputStream
          import java.io.FileOutputStream
          import java.security.MessageDigest
          import java.util.Locale

          class MainActivity : Activity() {

              private val uris = ArrayList<Uri>()
              private val names = ArrayList<String>()
              private val sizes = ArrayList<Long>()

              private var output: Uri? = null
              private var reversed = false
              private var lastHash: String? = null
              private var currentConsole = "PS5"
              @Volatile private var cancelled = false
              private val ui = Handler(Looper.getMainLooper())
              private var lastNotifTime = 0L

              private lateinit var listView: TextView
              private lateinit var checkView: TextView
              private lateinit var outView: TextView
              private lateinit var statusView: TextView
              private lateinit var hashView: TextView
              private lateinit var hashField: EditText
              private lateinit var verifyBox: CheckBox
              private lateinit var deleteBox: CheckBox
              private lateinit var bar: ProgressBar
              private lateinit var pickBtn: Button
              private lateinit var dirBtn: Button
              private lateinit var outBtn: Button
              private lateinit var goBtn: Button
              private lateinit var cancelBtn: Button
              private lateinit var revBtn: Button
              private lateinit var copyBtn: Button

              private lateinit var btnPs3: Button
              private lateinit var btnPs4: Button
              private lateinit var btnPs5: Button
              private lateinit var btnSplit: Button

              private val accent = Color.parseColor("#38BDF8")
              private val dim = Color.parseColor("#94A3B8")
              private val cardBg = Color.parseColor("#1E293B")
              private val bgMain = Color.parseColor("#0F172A")
              private val activeColor = Color.parseColor("#0284C7")

              private val NOTIF_ID_PROGRESS = 101
              private val NOTIF_ID_RESULT = 102

              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  createNotificationChannel()
                  checkPermissions()
                  showMergerScreen()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "pkg_channel",
                          "PKG Merger Notifications",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Progression et alertes"
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 100)
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun updateProgressNotif(msg: String, pct: Int) {
                  try {
                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle("⚡ PKG Merger Suite")
                          .setContentText(msg)
                          .setSmallIcon(android.R.drawable.ic_menu_save)
                          .setProgress(100, pct, false)
                          .setOngoing(true)
                          .build()

                      getSystemService(NotificationManager::class.java).notify(NOTIF_ID_PROGRESS, notification)
                  } catch (_: Exception) {}
              }

              private fun showResultNotif(title: String, message: String) {
                  try {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.cancel(NOTIF_ID_PROGRESS)

                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle(title)
                          .setContentText(message)
                          .setSmallIcon(android.R.drawable.ic_menu_save)
                          .setAutoCancel(true)
                          .build()

                      nm.notify(NOTIF_ID_RESULT, notification)
                  } catch (_: Exception) {}
              }

              private fun showMergerScreen() {
                  val pad = dp(16)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                      setBackgroundColor(bgMain)
                  }

                  val headerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(4), 0, dp(12))
                  }
                  headerLayout.addView(TextView(this).apply {
                      text = "⚡ PKG MERGER SUITE"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                  })
                  headerLayout.addView(TextView(this).apply {
                      text = "Support universel PS3, PS4, PS5 & Splitter"
                      textSize = 12f
                      setTextColor(dim)
                      setPadding(0, dp(2), 0, 0)
                  })
                  col.addView(headerLayout)

                  val consoleCard = createCard()
                  consoleCard.addView(text("Mode de fonctionnement", 14f, accent, true))
                  
                  val menuLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  btnPs3 = Button(this).apply { text = "PS3"; setOnClickListener { setConsole("PS3") } }
                  btnPs4 = Button(this).apply { text = "PS4"; setOnClickListener { setConsole("PS4") } }
                  btnPs5 = Button(this).apply { text = "PS5"; setOnClickListener { setConsole("PS5") } }
                  btnSplit = Button(this).apply { text = "Splitter"; setOnClickListener { setConsole("SPLIT") } }

                  val btnParams = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { marginEnd = dp(4) }
                  menuLayout.addView(btnPs3, btnParams)
                  menuLayout.addView(btnPs4, btnParams)
                  menuLayout.addView(btnPs5, btnParams)
                  menuLayout.addView(btnSplit, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  consoleCard.addView(menuLayout, lp())
                  col.addView(consoleCard, lpCard())

                  val card1 = createCard()
                  card1.addView(text("1. Sélection des fichiers .pkg uniquement", 14f, accent, true))
                  
                  pickBtn = Button(this).apply {
                      text = "📁 Choisir les .pkg"
                      setOnClickListener { pick() }
                  }
                  card1.addView(pickBtn, lp())

                  dirBtn = Button(this).apply {
                      text = "📂 Choisir un dossier (.pkg seulement)"
                      setOnClickListener { pickFolder() }
                  }
                  card1.addView(dirBtn, lp())

                  revBtn = Button(this).apply {
                      text = "🔀 Inverser l'ordre des parties"
                      setOnClickListener { reversed = !reversed; refresh() }
                  }
                  card1.addView(revBtn, lp())

                  listView = text("Aucun fichier .pkg sélectionné.", 12f, dim).apply {
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(8), 0, dp(4))
                  }
                  card1.addView(listView, lp())
                  col.addView(card1, lpCard())

                  val card2 = createCard()
                  card2.addView(text("2. Sortie & Traitement", 14f, accent, true))

                  outBtn = Button(this).apply {
                      text = "💾 Définir l'emplacement de sortie"
                      setOnClickListener { pickOutput() }
                  }
                  card2.addView(outBtn, lp())

                  outView = text("Sortie : —", 12f, dim).apply { 
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(4), 0, dp(8))
                  }
                  card2.addView(outView, lp())

                  val actionLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  goBtn = Button(this).apply {
                      text = "▶️ Lancer"
                      setOnClickListener { executeAction() }
                  }
                  actionLayout.addView(goBtn, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                  cancelBtn = Button(this).apply {
                      text = "❌ Annuler"
                      isEnabled = false
                      setOnClickListener { cancelled = true }
                  }
                  actionLayout.addView(cancelBtn, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { leftMargin = dp(8) })
                  card2.addView(actionLayout, lp())

                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 1000
                      progress = 0
                      setPadding(0, dp(12), 0, dp(4))
                  }
                  card2.addView(bar, lp())

                  statusView = text("Prêt.", 13f, accent).apply { setTypeface(null, Typeface.BOLD) }
                  card2.addView(statusView, lp())
                  col.addView(card2, lpCard())

                  val card3 = createCard()
                  card3.addView(text("3. Sécurité & Hash", 14f, accent, true))

                  verifyBox = CheckBox(this).apply {
                      text = "Relire le fichier après écriture"
                      isChecked = true
                      setTextColor(dim)
                      textSize = 12f
                  }
                  card3.addView(verifyBox, lp())

                  deleteBox = CheckBox(this).apply {
                      text = "Supprimer les sources après succès"
                      isChecked = false
                      setTextColor(dim)
                      textSize = 12f
                  }
                  card3.addView(deleteBox, lp())

                  hashField = EditText(this).apply {
                      hint = "Hash attendu (SHA-256)"
                      setTextColor(Color.WHITE)
                      setHintTextColor(dim)
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                  }
                  card3.addView(hashField, lp())

                  hashView = text("", 11f, accent).apply { typeface = Typeface.MONOSPACE }
                  card3.addView(hashView, lp())

                  copyBtn = Button(this).apply {
                      text = "📋 Copier le SHA-256"
                      isEnabled = false
                      setOnClickListener { copyHash() }
                  }
                  card3.addView(copyBtn, lp())
                  col.addView(card3, lpCard())

                  setConsole("PS5")
                  refresh()

                  setContentView(ScrollView(this).apply { 
                      setBackgroundColor(bgMain)
                      addView(col) 
                  })
              }

              private fun setConsole(c: String) {
                  currentConsole = c
                  btnPs3.setBackgroundColor(if (c == "PS3") activeColor else Color.DKGRAY)
                  btnPs4.setBackgroundColor(if (c == "PS4") activeColor else Color.DKGRAY)
                  btnPs5.setBackgroundColor(if (c == "PS5") activeColor else Color.DKGRAY)
                  btnSplit.setBackgroundColor(if (c == "SPLIT") activeColor else Color.DKGRAY)
                  goBtn.text = if (c == "SPLIT") "▶️ Lancer le découpage" else "▶️ Lancer la fusion ($c)"
                  refresh()
              }

              private fun lp() = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(4) }
              private fun lpCard() = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { topMargin = dp(12); bottomMargin = dp(4) }

              private fun createCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = GradientDrawable().apply {
                          setColor(cardBg)
                          cornerRadius = dp(14).toFloat()
                      }
                  }
              }

              private fun text(t: String, size: Float, color: Int, bold: Boolean = false) =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, dp(2), 0, dp(2))
                  }

              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_SHORT).show()

              private fun pick() {
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      }, 1
                  )
              }

              private fun pickFolder() {
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }, 3
                  )
              }

              private fun pickOutput() {
                  if (uris.isEmpty()) {
                      toast("Choisis d'abord les fichiers .pkg !")
                      return
                  }
                  startActivityForResult(
                      Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "application/octet-stream"
                          putExtra(Intent.EXTRA_TITLE, suggestName())
                      }, 2
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res != RESULT_OK) return

                  if (req == 1) {
                      uris.clear(); names.clear(); sizes.clear()
                      val clip = data?.clipData
                      if (clip != null) {
                          for (i in 0 until clip.itemCount) {
                              val u = clip.getItemAt(i).uri
                              if (isPkgFile(getFileName(u))) add(u)
                          }
                      } else {
                          data?.data?.let { u -> if (isPkgFile(getFileName(u))) add(u) }
                      }
                      reversed = false
                      refresh()
                  } else if (req == 2) {
                      val u = data?.data ?: return
                      persist(u, true)
                      output = u
                      if (::outView.isInitialized) {
                          outView.text = "Sortie : ${u.lastPathSegment}"
                      }
                  } else if (req == 3) {
                      val tree = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(tree, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (_: Exception) {}
                      loadTree(tree)
                  }
              }

              private fun isPkgFile(name: String): Boolean {
                  val lower = name.lowercase()
                  return lower.endsWith(".pkg") || lower.contains(".pkg.")
              }

              private fun getFileName(u: Uri): String {
                  var n = "file.pkg"
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (c.moveToFirst() && ni >= 0 && !c.isNull(ni)) c.getString(ni)?.let { n = it }
                      }
                  } catch (_: Exception) {}
                  return n
              }

              private fun loadTree(tree: Uri) {
                  uris.clear(); names.clear(); sizes.clear()
                  try {
                      val docId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId)
                      val cols = arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_SIZE,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      )
                      contentResolver.query(children, cols, null, null, null)?.use { c ->
                          while (c.moveToNext()) {
                              val id = c.getString(0)
                              val name = c.getString(1)
                              val mime = c.getString(3)
                              if (id != null && name != null && mime != DocumentsContract.Document.MIME_TYPE_DIR) {
                                  if (isPkgFile(name)) {
                                      val size = if (c.isNull(2)) 0L else c.getLong(2)
                                      uris.add(DocumentsContract.buildDocumentUriUsingTree(tree, id))
                                      names.add(name)
                                      sizes.add(size)
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      toast("Erreur lecture dossier : ${e.message}")
                  }
                  reversed = false
                  refresh()
                  if (uris.isEmpty()) toast("Aucun fichier .pkg valide trouvé dans ce dossier.")
              }

              private fun persist(u: Uri, write: Boolean = false) {
                  try {
                      var f = Intent.FLAG_GRANT_READ_URI_PERMISSION
                      if (write) f = f or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      contentResolver.takePersistableUriPermission(u, f)
                  } catch (_: Exception) {}
              }

              private fun add(u: Uri) {
                  persist(u)
                  var n = getFileName(u)
                  var s = size(u)
                  uris.add(u); names.add(n); sizes.add(s)
              }

              private fun refresh() {
                  if (!::listView.isInitialized) return
                  if (uris.isEmpty()) {
                      listView.text = "Aucun fichier .pkg sélectionné."
                      return
                  }
                  val order = order()
                  val total = order.sumOf { sizes[it] }
                  listView.text = buildString {
                      append(order.size).append(" fichier(s) .pkg")
                      if (total > 0) append(" • ").append(fmt(total))
                      append("\n")
                      order.forEachIndexed { i, idx ->
                          append(i + 1).append(". ").append(names[idx])
                          if (sizes[idx] > 0) append("  (").append(fmt(sizes[idx])).append(")")
                          append("\n")
                      }
                  }
              }

              private fun order(): List<Int> {
                  val o = uris.indices.sortedWith { a, b -> naturalCompare(names[a], names[b]) }
                  return if (reversed) o.reversed() else o
              }

              private fun executeAction() {
                  if (currentConsole == "SPLIT") {
                      splitPkg()
                  } else {
                      mergePkg()
                  }
              }

              private fun splitPkg() {
                  if (uris.isEmpty()) { toast("Sélectionne un fichier .pkg à découper."); return }
                  val out = output
                  if (out == null) { toast("Choisis le dossier/emplacement de sortie."); return }
                  toast("Découpage $currentConsole prêt")
              }

              private fun mergePkg() {
                  if (uris.size < 2 && currentConsole != "PS3") { toast("Sélectionne au moins 2 parties .pkg."); return }
                  val out = output
                  if (out == null) { toast("Choisis le fichier de sortie."); return }

                  val list = order().map { uris[it] }
                  cancelled = false
                  goBtn.isEnabled = false
                  cancelBtn.isEnabled = true
                  bar.progress = 0
                  statusView.text = "Fusion $currentConsole en cours…"

                  Thread {
                      val sha256 = MessageDigest.getInstance("SHA-256")
                      var success = false
                      val t0 = System.currentTimeMillis()

                      try {
                          val pfd = contentResolver.openFileDescriptor(out, "wt")
                              ?: throw IllegalStateException("Ouverture sortie impossible")
                          try {
                              val os = BufferedOutputStream(FileOutputStream(pfd.fileDescriptor), 1 shl 20)
                              val buf = ByteArray(1 shl 20)
                              var bytesRead: Int
                              for (u in list) {
                                  if (cancelled) throw InterruptedException("Annulé")
                                  contentResolver.openInputStream(u)?.use { input ->
                                      while (true) {
                                          if (cancelled) throw InterruptedException("Annulé")
                                          bytesRead = input.read(buf)
                                          if (bytesRead <= 0) break
                                          os.write(buf, 0, bytesRead)
                                          sha256.update(buf, 0, bytesRead)
                                      }
                                  }
                              }
                              os.flush()
                          } finally {
                              pfd.close()
                          }
                          success = true
                      } catch (e: Throwable) {
                          ui.post {
                              statusView.text = "Erreur : ${e.message}"
                              doneUi()
                          }
                          return@Thread
                      }

                      if (!success) return@Thread

                      val h256 = hex(sha256.digest())
                      val secs = (System.currentTimeMillis() - t0) / 1000

                      ui.post {
                          bar.progress = 1000
                          lastHash = h256
                          copyBtn.isEnabled = true
                          statusView.text = "Succès ($currentConsole) en ${secs}s"
                          showResultNotif("PKG Merger", "Fusion réussie !")
                          doneUi()
                      }
                  }.start()
              }

              private fun doneUi() {
                  if (::goBtn.isInitialized) {
                      goBtn.isEnabled = true
                      cancelBtn.isEnabled = false
                  }
              }

              private fun copyHash() {
                  val h = lastHash ?: return
                  getSystemService(ClipboardManager::class.java).setPrimaryClip(ClipData.newPlainText("sha256", h))
                  toast("SHA-256 copié")
              }

              private fun size(u: Uri): Long {
                  return try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.SIZE)
                          if (c.moveToFirst() && i >= 0 && !c.isNull(i)) c.getLong(i) else 0L
                      } ?: 0L
                  } catch (_: Exception) { 0L }
              }

              private fun hex(b: ByteArray): String = b.joinToString("") { "%02x".format(it) }

              private fun fmt(b: Long): String {
                  if (b <= 0) return "0 o"
                  val u = arrayOf("o", "Ko", "Mo", "Go", "To")
                  var v = b.toDouble()
                  var i = 0
                  while (v >= 1024 && i < u.size - 1) { v /= 1024; i++ }
                  return if (i == 0) "$b o" else String.format(Locale.US, "%.2f %s", v, u[i])
              }

              private val chunk = Regex("(\\d+|\\D+)")
              private fun naturalCompare(a: String, b: String): Int {
                  val ca = chunk.findAll(a).map { it.value }.toList()
                  val cb = chunk.findAll(b).map { it.value }.toList()
                  for (i in 0 until minOf(ca.size, cb.size)) {
                      val x = ca[i]
                      val y = cb[i]
                      val dx = x[0].isDigit()
                      val dy = y[0].isDigit()
                      val c = when {
                          dx && dy -> {
                              val xs = x.trimStart('0').ifEmpty { "0" }
                              val ys = y.trimStart('0').ifEmpty { "0" }
                              if (xs.length != ys.length) xs.length - ys.length else xs.compareTo(ys)
                          }
                          dx != dy -> if (dx) 1 else -1
                          else -> x.compareTo(y, ignoreCase = true)
                      }
                      if (c != 0) return c
                  }
                  return ca.size - cb.size
              }

              private fun suggestName(): String {
                  if (names.isEmpty()) return "merged.pkg"
                  val first = names.minWithOrNull { a, b -> naturalCompare(a, b) } ?: return "merged.pkg"
                  val m = Regex("^(.*?)[._\\- ]?(?:part)?[._\\- ]?(\\d+)$", RegexOption.IGNORE_CASE).find(first)
                  var base = m?.groupValues?.get(1)?.trimEnd('.', '_', '-', ' ') ?: first
                  if (base.lowercase().endsWith(".pkg")) return base
                  return "$base.pkg"
              }
          }
          EOF

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK v2.1.0
        run: cp app/build/outputs/apk/debug/app-debug.apk PkgMerger-v2.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pkg-merger-v2.1.0-apk
          path: PkgMerger-v2.1.0.apk
          if-no-files-found: error
