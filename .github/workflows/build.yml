name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Compile Android release from repository sources
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Verify source files
        run: |
          test -f app/src/main/java/com/venice/pkgmerger/MainActivity.kt
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Building the committed Android sources; no source files will be regenerated."

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and calculate SHA-256
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          fi
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/PS-PKG-MERGER-v3.2.apk
          sha256sum dist/PS-PKG-MERGER-v3.2.apk | tee dist/SHA256SUMS.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PS-PKG-MERGER-v3.2-Android
          path: dist/*
          if-no-files-found: error
          retention-days: 30
