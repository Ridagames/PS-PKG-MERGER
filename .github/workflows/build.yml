name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Réécrire les sources depuis ce workflow (écrase tes modifs)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Générer le projet
        env:
          FORCE: ${{ github.event.inputs.regenerate == 'true' && '1' || '0' }}
        run: |
          set -e
          mkdir -p app/src/main/java/com/venice/pkgmerger
          
          rm -f app/src/main/java/com/venice/pkgmerger/MergeService.kt

          write() {
            f="$1"
            if [ "${FORCE:-0}" = "1" ] || [ ! -f "$f" ]; then
              echo "  écrit   $f"
              cat > "$f"
            else
              echo "  conserve $f"
              cat > /dev/null
            fi
          }

          write .gitignore <<'EOF'
          .gradle/
          build/
          local.properties
          *.apk
          *.jks
          *.keystore
          EOF

          write settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PS5PkgMerger"
          include(":app")
          EOF

          write build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          write gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          write app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.venice.pkgmerger"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.venice.pkgmerger"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 20
                  versionName = "2.9"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
          }
          EOF

          write app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:label="PS5 PKG Merger"
                  android:icon="@android:drawable/ic_menu_save"
                  android:roundIcon="@android:drawable/ic_menu_save"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="PS5 PKG Merger">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          write app/src/main/java/com/venice/pkgmerger/MainActivity.kt <<'EOF'
          package com.venice.pkgmerger

          import android.Manifest
          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.DocumentsContract
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.text.Html
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.BufferedOutputStream
          import java.io.FileOutputStream
          import java.security.MessageDigest
          import java.util.Locale

          class MainActivity : Activity() {

              private val uris = ArrayList<Uri>()
              private val names = ArrayList<String>()
              private val sizes = ArrayList<Long>()

              private var output: Uri? = null
              private var reversed = false
              private var lastHash: String? = null
              @Volatile private var cancelled = false
              private val ui = Handler(Looper.getMainLooper())

              private lateinit var listView: TextView
              private lateinit var checkView: TextView
              private lateinit var outView: TextView
              private lateinit var statusView: TextView
              private lateinit var hashView: TextView
              private lateinit var hashField: EditText
              private lateinit var verifyBox: CheckBox
              private lateinit var deleteBox: CheckBox
              private lateinit var bar: ProgressBar
              private lateinit var pickBtn: Button
              private lateinit var dirBtn: Button
              private lateinit var outBtn: Button
              private lateinit var goBtn: Button
              private lateinit var cancelBtn: Button
              private lateinit var revBtn: Button
              private lateinit var copyBtn: Button

              private val accent = Color.parseColor("#38BDF8")
              private val dim = Color.parseColor("#94A3B8")
              private val cardBg = Color.parseColor("#1E293B")
              private val bgMain = Color.parseColor("#0F172A")

              private val NOTIF_ID_PROGRESS = 101
              private val NOTIF_ID_RESULT = 102

              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  createNotificationChannel()
                  checkPermissions()
                  showMergerScreen()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "pkg_channel",
                          "PS5 PKG Merger Notifications",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Progression et alertes de fusion"
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun checkPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 100)
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun updateProgressNotif(msg: String, pct: Int) {
                  try {
                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle("⚡ PS5 PKG Merger")
                          .setContentText(msg)
                          .setSmallIcon(android.R.drawable.ic_menu_save)
                          .setProgress(100, pct, false)
                          .setOngoing(true)
                          .build()

                      getSystemService(NotificationManager::class.java).notify(NOTIF_ID_PROGRESS, notification)
                  } catch (_: Exception) {}
              }

              private fun showResultNotif(title: String, message: String) {
                  try {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.cancel(NOTIF_ID_PROGRESS)

                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          android.app.Notification.Builder(this, "pkg_channel")
                      } else {
                          @Suppress("DEPRECATION")
                          android.app.Notification.Builder(this)
                      }
                      val notification = builder
                          .setContentTitle(title)
                          .setContentText(message)
                          .setSmallIcon(android.R.drawable.ic_menu_save)
                          .setAutoCancel(true)
                          .build()

                      nm.notify(NOTIF_ID_RESULT, notification)
                  } catch (_: Exception) {}
              }

              private fun showMergerScreen() {
                  val pad = dp(16)
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                      setBackgroundColor(bgMain)
                  }

                  val headerLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(4), 0, dp(12))
                  }
                  headerLayout.addView(TextView(this).apply {
                      text = "⚡ PS5 PKG MERGER"
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                  })
                  headerLayout.addView(TextView(this).apply {
                      text = "Réassemble tes parties de jeux et vérifie l'intégrité en toute sécurité."
                      textSize = 12f
                      setTextColor(dim)
                      setPadding(0, dp(2), 0, 0)
                  })
                  col.addView(headerLayout)

                  val card1 = createCard()
                  card1.addView(text("1. Sélection des parties (.pkg / .pkg.0 ...)", 14f, accent, true))
                  
                  pickBtn = Button(this).apply {
                      text = "📁 Choisir les fichiers"
                      setOnClickListener { pick() }
                  }
                  card1.addView(pickBtn, lp())

                  dirBtn = Button(this).apply {
                      text = "📂 Choisir un dossier complet"
                      setOnClickListener { pickFolder() }
                  }
                  card1.addView(dirBtn, lp())

                  revBtn = Button(this).apply {
                      text = "🔀 Inverser l'ordre des parties"
                      setOnClickListener { reversed = !reversed; refresh() }
                  }
                  card1.addView(revBtn, lp())

                  listView = text("Aucune partie sélectionnée.", 12f, dim).apply {
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(8), 0, dp(4))
                  }
                  card1.addView(listView, lp())

                  checkView = text("", 12f, accent).apply { typeface = Typeface.MONOSPACE }
                  card1.addView(checkView, lp())
                  col.addView(card1, lpCard())

                  val card2 = createCard()
                  card2.addView(text("2. Fichier de sortie & Fusion", 14f, accent, true))

                  outBtn = Button(this).apply {
                      text = "💾 Définir l'emplacement de sortie"
                      setOnClickListener { pickOutput() }
                  }
                  card2.addView(outBtn, lp())

                  outView = text("Sortie : —", 12f, dim).apply { 
                      typeface = Typeface.MONOSPACE
                      setPadding(0, dp(4), 0, dp(8))
                  }
                  card2.addView(outView, lp())

                  val mergeLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  goBtn = Button(this).apply {
                      text = "▶️ Lancer la fusion"
                      setOnClickListener { merge() }
                  }
                  mergeLayout.addView(goBtn, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))

                  cancelBtn = Button(this).apply {
                      text = "❌ Annuler"
                      isEnabled = false
                      setOnClickListener { cancelled = true }
                  }
                  mergeLayout.addView(cancelBtn, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { leftMargin = dp(8) })
                  card2.addView(mergeLayout, lp())

                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 1000
                      progress = 0
                      setPadding(0, dp(12), 0, dp(4))
                  }
                  card2.addView(bar, lp())

                  statusView = text("Prêt à fusionner.", 13f, accent).apply { setTypeface(null, Typeface.BOLD) }
                  card2.addView(statusView, lp())
                  col.addView(card2, lpCard())

                  val card3 = createCard()
                  card3.addView(text("3. Options de sécurité & Hash", 14f, accent, true))

                  verifyBox = CheckBox(this).apply {
                      text = "Relire le fichier après écriture (contrôle intégrité)"
                      isChecked = true
                      setTextColor(dim)
                      textSize = 12f
                  }
                  card3.addView(verifyBox, lp())

                  deleteBox = CheckBox(this).apply {
                      text = "Supprimer les sources après fusion réussie"
                      isChecked = false
                      setTextColor(dim)
                      textSize = 12f
                  }
                  card3.addView(deleteBox, lp())

                  card3.addView(text("Hash attendu (Optionnel : MD5 / SHA-1 / SHA-256)", 12f, dim).apply {
                      setPadding(0, dp(8), 0, 0)
                  })
                  hashField = EditText(this).apply {
                      hint = "Coller un hash pour comparer"
                      setTextColor(Color.WHITE)
                      setHintTextColor(dim)
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                  }
                  card3.addView(hashField, lp())

                  hashView = text("", 11f, accent).apply { typeface = Typeface.MONOSPACE }
                  card3.addView(hashView, lp())

                  copyBtn = Button(this).apply {
                      text = "📋 Copier le SHA-256 produit"
                      isEnabled = false
                      setOnClickListener { copyHash() }
                  }
                  card3.addView(copyBtn, lp())
                  col.addView(card3, lpCard())

                  col.addView(
                      text(
                          "💡 Astuce : Une notification de suivi s'affiche et restera active même en arrière-plan.",
                          11f, dim
                      ).apply { setPadding(dp(4), dp(8), dp(4), dp(16)) }
                  )

                  refresh()

                  setContentView(ScrollView(this).apply { 
                      setBackgroundColor(bgMain)
                      addView(col) 
                  })
              }

              private fun lp() = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply {
                  topMargin = dp(4)
              }

              private fun lpCard() = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply {
                  topMargin = dp(12)
                  bottomMargin = dp(4)
              }

              private fun createCard(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = GradientDrawable().apply {
                          setColor(cardBg)
                          cornerRadius = dp(14).toFloat()
                      }
                  }
              }

              private fun text(t: String, size: Float, color: Int, bold: Boolean = false) =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, dp(2), 0, dp(2))
                  }

              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_SHORT).show()

              private fun pick() {
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      }, 1
                  )
              }

              private fun pickFolder() {
                  startActivityForResult(
                      Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }, 3
                  )
              }

              private fun pickOutput() {
                  startActivityForResult(
                      Intent(Intent.ACTION_CREATE_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "application/octet-stream"
                          putExtra(Intent.EXTRA_TITLE, suggestName())
                      }, 2
                  )
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res != RESULT_OK) return

                  if (req == 1) {
                      uris.clear(); names.clear(); sizes.clear()
                      val clip = data?.clipData
                      if (clip != null) {
                          for (i in 0 until clip.itemCount) add(clip.getItemAt(i).uri)
                      } else {
                          data?.data?.let { add(it) }
                      }
                      reversed = false
                      refresh()
                  } else if (req == 2) {
                      val u = data?.data ?: return
                      persist(u, true)
                      output = u
                      if (::outView.isInitialized) {
                          outView.text = "Sortie : ${u.lastPathSegment}"
                      }
                  } else if (req == 3) {
                      val tree = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(
                              tree, Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {
                      }
                      loadTree(tree)
                  }
              }

              private fun loadTree(tree: Uri) {
                  uris.clear(); names.clear(); sizes.clear()
                  try {
                      val docId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId)
                      val cols = arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_SIZE,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      )
                      val all = ArrayList<Triple<Uri, String, Long>>()
                      contentResolver.query(children, cols, null, null, null)?.use { c ->
                          while (c.moveToNext()) {
                              val id = c.getString(0)
                              val name = c.getString(1)
                              val mime = c.getString(3)
                              if (id != null && name != null &&
                                  mime != DocumentsContract.Document.MIME_TYPE_DIR
                              ) {
                                  val size = if (c.isNull(2)) 0L else c.getLong(2)
                                  all.add(
                                      Triple(
                                          DocumentsContract.buildDocumentUriUsingTree(tree, id),
                                          name, size
                                      )
                                  )
                              }
                          }
                      }
                      val picked = all.filter { isPkgPart(it.second) }.ifEmpty { all }
                      picked.forEach { p -> uris.add(p.first); names.add(p.second); sizes.add(p.third) }
                  } catch (e: Exception) {
                      toast("Lecture du dossier impossible : ${e.message}")
                  }
                  reversed = false
                  refresh()
                  if (uris.size < 2) toast("Aucune partie .pkg trouvée dans ce dossier.")
              }

              private fun persist(u: Uri, write: Boolean = false) {
                  try {
                      var f = Intent.FLAG_GRANT_READ_URI_PERMISSION
                      if (write) f = f or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      contentResolver.takePersistableUriPermission(u, f)
                  } catch (_: Exception) {
                  }
              }

              private fun add(u: Uri) {
                  persist(u)
                  var n = u.lastPathSegment ?: "part"
                  var s = 0L
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (ni >= 0 && !c.isNull(ni)) c.getString(ni)?.let { n = it }
                              val si = c.getColumnIndex(OpenableColumns.SIZE)
                              if (si >= 0 && !c.isNull(si)) s = c.getLong(si)
                          }
                      }
                  } catch (_: Exception) {
                  }
                  uris.add(u); names.add(n); sizes.add(s)
              }

              private fun refresh() {
                  if (!::listView.isInitialized) return
                  if (uris.isEmpty()) {
                      listView.text = "Aucune partie sélectionnée."
                      checkView.text = ""
                      return
                  }
                  val order = order()
                  val total = order.sumOf { sizes[it] }
                  listView.text = buildString {
                      append(order.size).append(" partie(s)")
                      if (total > 0) append(" • ").append(fmt(total))
                      append(" • ordre ").append(if (reversed) "inversé" else "croissant").append("\n")
                      order.forEachIndexed { i, idx ->
                          append(i + 1).append(". ").append(names[idx])
                          if (sizes[idx] > 0) append("  (").append(fmt(sizes[idx])).append(")")
                          append("\n")
                      }
                  }
                  checkView.text = Html.fromHtml(checksHtml(), Html.FROM_HTML_MODE_LEGACY)
              }

              private fun checksHtml(): String {
                  val sb = StringBuilder()
                  val order = order()
                  if (order.isEmpty()) return ""

                  if (hasPkgMagic(uris[order[0]])) {
                      sb.append("<font color=\"#34D399\">✓ En-tête PKG valide (7F 43 4E 54)</font><br>")
                  } else {
                      sb.append("<font color=\"#FBBF24\">⚠ En-tête PKG absent sur la 1re partie</font><br>")
                  }

                  val s = order.map { sizes[it] }
                  val body = s.dropLast(1)
                  when {
                      body.isEmpty() ->
                          sb.append("<font color=\"#94A3B8\">• Une seule partie</font><br>")
                      body.distinct().size > 1 ->
                          sb.append("<font color=\"#FBBF24\">⚠ Parties de tailles différentes</font><br>")
                      s.last() > body[0] ->
                          sb.append("<font color=\"#FBBF24\">⚠ Dernière partie plus grande que les autres</font><br>")
                      else ->
                          sb.append("<font color=\"#34D399\">✓ Tailles cohérentes (")
                              .append(fmt(body[0])).append(" par partie)</font><br>")
                  }
                  return sb.toString()
              }

              private fun order(): List<Int> {
                  val o = uris.indices.sortedWith { a, b -> naturalCompare(names[a], names[b]) }
                  return if (reversed) o.reversed() else o
              }

              private fun merge() {
                  if (uris.size < 2) { toast("Sélectionne au moins 2 parties."); return }
                  val out = output
                  if (out == null) { toast("Choisis d'abord le fichier de sortie."); return }

                  val list = order().map { uris[it] }
                  val wantReread = verifyBox.isChecked
                  val wantDelete = deleteBox.isChecked
                  val expected = hashField.text.toString().trim().lowercase().replace(" ", "")

                  cancelled = false
                  pickBtn.isEnabled = false
                  dirBtn.isEnabled = false
                  revBtn.isEnabled = false
                  outBtn.isEnabled = false
                  goBtn.isEnabled = false
                  copyBtn.isEnabled = false
                  cancelBtn.isEnabled = true
                  hashView.text = ""
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  bar.progress = 0
                  statusView.text = "Fusion en cours…"

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  val wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "PS5PkgMerger::MergeWakeLock")
                  wakeLock.acquire(10800000L) // 3h max

                  Thread {
                      val total = list.sumOf { size(it) }
                      val md5 = MessageDigest.getInstance("MD5")
                      val sha1 = MessageDigest.getInstance("SHA-1")
                      val sha256 = MessageDigest.getInstance("SHA-256")
                      val problems = ArrayList<String>()
                      var done = 0L
                      var lastPush = 0L
                      var success = false
                      val t0 = System.currentTimeMillis()

                      try {
                          val pfd = contentResolver.openFileDescriptor(out, "wt")
                              ?: throw IllegalStateException("Ouverture de la sortie impossible")
                          try {
                              val os = BufferedOutputStream(FileOutputStream(pfd.fileDescriptor), 1 shl 20)
                              val buf = ByteArray(1 shl 20)
                              for (u in list) {
                                  if (cancelled) throw InterruptedException("Fusion annulée")
                                  val ins = contentResolver.openInputStream(u)
                                      ?: throw IllegalStateException("Lecture impossible")
                                  ins.use { input ->
                                      while (true) {
                                          if (cancelled) throw InterruptedException("Fusion annulée")
                                          val r = input.read(buf)
                                          if (r <= 0) break
                                          os.write(buf, 0, r)
                                          md5.update(buf, 0, r)
                                          sha1.update(buf, 0, r)
                                          sha256.update(buf, 0, r)
                                          done += r
                                          val now = System.currentTimeMillis()
                                          if (now - lastPush > 250) {
                                              lastPush = now
                                              push(done, total, t0)
                                          }
                                      }
                                  }
                              }
                              os.flush()
                              try { pfd.fileDescriptor.sync() } catch (_: Exception) {}
                          } finally {
                              try { pfd.close() } catch (_: Exception) {}
                          }
                          success = true
                      } catch (e: Throwable) {
                          ui.post {
                              statusView.text = if (cancelled) "Fusion annulée." else "Erreur : ${e.message}"
                              showResultNotif("PS5 PKG Merger", "Échec de la fusion : ${e.message}")
                              if (wakeLock.isHeld) wakeLock.release()
                              doneUi()
                          }
                          return@Thread
                      }

                      if (!success) {
                          if (wakeLock.isHeld) wakeLock.release()
                          return@Thread
                      }

                      val h256 = hex(sha256.digest())
                      val h1 = hex(sha1.digest())
                      val h5 = hex(md5.digest())

                      val disk = size(out)
                      if (total > 0 && disk != done) {
                          problems.add("Taille sur disque différente de l'écrit")
                      }

                      if (wantReread) {
                          ui.post { 
                              statusView.text = "Vérification en cours..." 
                              updateProgressNotif("Vérification de l'intégrité...", 100)
                          }
                          try {
                              val re = MessageDigest.getInstance("SHA-256")
                              contentResolver.openInputStream(out)?.use { ins ->
                                  val b = ByteArray(1 shl 20)
                                  while (true) {
                                      val r = ins.read(b)
                                      if (r <= 0) break
                                      re.update(b, 0, r)
                                  }
                              }
                              if (hex(re.digest()) != h256) {
                                  problems.add("Hash différent après relecture")
                              }
                          } catch (e: Throwable) {
                              problems.add("Relecture impossible")
                          }
                      }

                      if (wantDelete && problems.isEmpty()) {
                          for (u in list) {
                              try { DocumentsContract.deleteDocument(contentResolver, u) } catch (_: Exception) {}
                          }
                      }

                      val secs = (System.currentTimeMillis() - t0) / 1000
                      val report = StringBuilder()
                      report.append("<font color=\"#94A3B8\">SHA-256 :</font> ").append(h256).append("<br>")
                      if (problems.isEmpty()) {
                          report.append("<font color=\"#34D399\">✓ Fusion réussie et vérifiée (${fmt(done)})</font>")
                          showResultNotif("PS5 PKG Merger", "Fusion et vérification terminées avec succès en ${secs}s !")
                      } else {
                          problems.forEach { report.append("<font color=\"#FBBF24\">⚠ ").append(it).append("</font><br>") }
                          showResultNotif("PS5 PKG Merger", "Fusion terminée avec des anomalies.")
                      }

                      ui.post {
                          bar.progress = 1000
                          lastHash = h256
                          copyBtn.isEnabled = true
                          hashView.text = Html.fromHtml(report.toString(), Html.FROM_HTML_MODE_LEGACY)
                          statusView.text = "Terminé avec succès en ${secs}s"
                          if (wakeLock.isHeld) wakeLock.release()
                          doneUi()
                      }
                  }.start()
              }

              private fun push(done: Long, total: Long, t0: Long) {
                  val elapsed = (System.currentTimeMillis() - t0) / 1000.0
                  val speed = if (elapsed > 0.5) done / elapsed else 0.0
                  val pct = if (total > 0) (done * 100 / total).toInt() else 0
                  val eta = if (speed > 0 && total > done) ((total - done) / speed).toLong() else -1L
                  val msg = buildString {
                      append(fmt(done))
                      if (total > 0) { append(" / "); append(fmt(total)) }
                      append(" • ").append(fmt(speed.toLong())).append("/s")
                      if (eta > 0) append(" • reste ").append(eta).append("s")
                  }
                  ui.post {
                      bar.progress = pct * 10
                      statusView.text = msg
                      updateProgressNotif(msg, pct)
                  }
              }

              private fun doneUi() {
                  if (::pickBtn.isInitialized) {
                      pickBtn.isEnabled = true
                      dirBtn.isEnabled = true
                      revBtn.isEnabled = true
                      outBtn.isEnabled = true
                      goBtn.isEnabled = true
                      cancelBtn.isEnabled = false
                  }
                  window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              private fun copyHash() {
                  val h = lastHash ?: return
                  getSystemService(ClipboardManager::class.java)
                      .setPrimaryClip(ClipData.newPlainText("sha256", h))
                  toast("SHA-256 copié dans le presse-papier")
              }

              private fun size(u: Uri): Long {
                  return try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.SIZE)
                          if (c.moveToFirst() && i >= 0 && !c.isNull(i)) c.getLong(i) else 0L
                      } ?: 0L
                  } catch (_: Exception) { 0L }
              }

              private fun hasPkgMagic(u: Uri): Boolean {
                  return try {
                      contentResolver.openInputStream(u)?.use { i ->
                          val b = ByteArray(4)
                          i.read(b) == 4 &&
                              b[0] == 0x7F.toByte() && b[1] == 0x43.toByte() &&
                              b[2] == 0x4E.toByte() && b[3] == 0x54.toByte()
                      } ?: false
                  } catch (_: Exception) { false }
              }

              private fun hex(b: ByteArray): String {
                  val sb = StringBuilder(b.size * 2)
                  for (x in b) sb.append(String.format("%02x", x))
                  return sb.toString()
              }

              private fun fmt(b: Long): String {
                  if (b <= 0) return "0 o"
                  val u = arrayOf("o", "Ko", "Mo", "Go", "To")
                  var v = b.toDouble()
                  var i = 0
                  while (v >= 1024 && i < u.size - 1) { v /= 1024; i++ }
                  return if (i == 0) "$b o" else String.format(Locale.US, "%.2f %s", v, u[i])
              }

              private val chunk = Regex("(\\d+|\\D+)")
              private val trailing = Regex("(\\d+)$")
              private val pkgPart = Regex("(?i)^.+\\.pkg(\\.(\\d+|part\\d+))?$")

              private fun isPkgPart(n: String) = pkgPart.matches(n)

              private fun naturalCompare(a: String, b: String): Int {
                  val ca = chunk.findAll(a).map { it.value }.toList()
                  val cb = chunk.findAll(b).map { it.value }.toList()
                  for (i in 0 until minOf(ca.size, cb.size)) {
                      val x = ca[i]
                      val y = cb[i]
                      val dx = x[0].isDigit()
                      val dy = y[0].isDigit()
                      val c = when {
                          dx && dy -> {
                              val xs = x.trimStart('0').ifEmpty { "0" }
                              val ys = y.trimStart('0').ifEmpty { "0" }
                              if (xs.length != ys.length) xs.length - ys.length else xs.compareTo(ys)
                          }
                          dx != dy -> if (dx) 1 else -1
                          else -> x.compareTo(y, ignoreCase = true)
                      }
                      if (c != 0) return c
                  }
                  return ca.size - cb.size
              }

              private fun suggestName(): String {
                  if (names.isEmpty()) return "merged.pkg"
                  val first = names.minWithOrNull { a, b -> naturalCompare(a, b) } ?: return "merged.pkg"
                  val m = Regex("^(.*?)[._\\- ]?(?:part)?[._\\- ]?(\\d+)$", RegexOption.IGNORE_CASE).find(first)
                  var base = m?.groupValues?.get(1)?.trimEnd('.', '_', '-', ' ') ?: first
                  if (base.isBlank()) base = "merged"
                  return if (base.lowercase().endsWith(".pkg")) base else "$base.pkg"
              }
          }
          EOF

      - name: Committer les sources (1re fois)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi

          git commit -m "chore: sources du projet [skip ci]"

          for i in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "OK: sources poussées."
              exit 0
            fi
            sleep 3
          done

          echo "Push impossible — le build continue quand même."
          exit 0

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PS5PkgMerger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps5-pkg-merger-apk
          path: PS5PkgMerger.apk
          if-no-files-found: error
