          append app/src/main/java/com/venice/pkgmerger/MainActivity.kt <<'EOF'

              private fun splitPkg() {
                  val treeUri = output ?: return
                  val sourceUri = uris[0]
                  processing = true; cancelled = false; goBtnLayout.isEnabled = false; cancelBtnLayout.isEnabled = true
                  bar.progress = 0; statusView.text = "Découpage en cours…"
                  log("=== DÉBUT DU DÉCOUPAGE ===")

                  Thread {
                      val total = size(sourceUri)
                      var done = 0.toLong()
                      var success = false
                      try {
                          val maxPartSize = 4.toLong() * 1024 * 1024 * 1024
                          var partIndex = 0
                          val baseName = getFileName(sourceUri).let { if (it.contains(".")) it.substringBeforeLast(".") else it }
                          var currentOutputStream: OutputStream? = null

                          val docId = DocumentsContract.getTreeDocumentId(treeUri)
                          val parentUri = DocumentsContract.buildChildDocumentsUriUsingTree(treeUri, docId)

                          fun openNextPart() {
                              try { currentOutputStream?.flush(); currentOutputStream?.close() } catch (_: Exception) {}
                              val partName = "$baseName.${String.format(Locale.US, "%02d", partIndex)}"
                              log("Création de la partie : $partName")
                              
                              val createdUri = DocumentsContract.createDocument(contentResolver, parentUri, "application/octet-stream", partName)
                                  ?: throw IllegalStateException("Impossible de créer $partName dans le dossier")

                              val pfdOut = contentResolver.openFileDescriptor(createdUri, "w") ?: throw IllegalStateException("Sortie impossible pour $partName")
                              currentOutputStream = BufferedOutputStream(FileOutputStream(pfdOut.fileDescriptor), 1 shl 20)
                              log("Flux ouvert avec succès pour : $partName")
                              partIndex++
                          }

                          openNextPart()
                          val pfdSource = contentResolver.openFileDescriptor(sourceUri, "r") ?: throw IllegalStateException("Source impossible")
                          pfdSource.use { pfd ->
                              FileInputStream(pfd.fileDescriptor).use { input ->
                                  log("Flux source ouvert. Taille totale : ${fmt(total)}")
                                  val buf = ByteArray(1 shl 20)
                                  var currentPartBytes = 0.toLong()
                                  while (true) {
                                      if (cancelled) throw InterruptedException("Annulé.")
                                      val bytesRead = input.read(buf)
                                      if (bytesRead <= 0) break
                                      var offset = 0
                                      while (offset < bytesRead) {
                                          if (currentPartBytes >= maxPartSize) { openNextPart(); currentPartBytes = 0.toLong() }
                                          val chunkToWrite = minOf(bytesRead - offset, (maxPartSize - currentPartBytes).toInt())
                                          currentOutputStream!!.write(buf, offset, chunkToWrite)
                                          offset += chunkToWrite; currentPartBytes += chunkToWrite; done += chunkToWrite
                                          val pct = if (total > 0) (done * 100 / total).toInt() else 0
                                          ui.post { bar.progress = pct * 10; statusView.text = "${fmt(done)} / ${fmt(total)}" }
                                      }
                                  }
                              }
                          }
                          currentOutputStream?.flush(); currentOutputStream?.close()
                          success = true; log("Découpage terminé avec succès sur tous les blocs.")
                      } catch (e: Throwable) {
                          log("❌ ERREUR : ${e.message}")
                      }
                      ui.post { processing = false; doneUi(); if (success) statusView.text = "Découpage réussi !" }
                  }.start()
              }

              private fun mergePkg() {
                  val out = output ?: return
                  val list = order().map { uris[it] }
                  processing = true; cancelled = false; goBtnLayout.isEnabled = false; cancelBtnLayout.isEnabled = true
                  bar.progress = 0; statusView.text = "Fusion en cours…"
                  log("=== DÉBUT DE LA FUSION ===")

                  Thread {
                      val total = list.sumOf { size(it) }
                      var done = 0.toLong()
                      var success = false
                      try {
                          val pfd = contentResolver.openFileDescriptor(out, "w") ?: throw IllegalStateException("Sortie impossible")
                          BufferedOutputStream(FileOutputStream(pfd.fileDescriptor), 1 shl 20).use { os ->
                              val buf = ByteArray(1 shl 20)
                              for (u in list) {
                                  contentResolver.openFileDescriptor(u, "r")?.use { pfdIn ->
                                      FileInputStream(pfdIn.fileDescriptor).use { input ->
                                          while (true) {
                                              if (cancelled) throw InterruptedException("Annulé.")
                                              val bytesRead = input.read(buf)
                                              if (bytesRead <= 0) break
                                              os.write(buf, 0, bytesRead)
                                              done += bytesRead
                                              val pct = if (total > 0) (done * 100 / total).toInt() else 0
                                              ui.post { bar.progress = pct * 10; statusView.text = "${fmt(done)} / ${fmt(total)}" }
                                          }
                                      }
                                  }
                              }
                              os.flush()
                          }
                          success = true; log("Fusion terminée avec succès.")
                      } catch (e: Throwable) {
                          log("❌ ERREUR : ${e.message}")
                      }
                      ui.post { processing = false; doneUi(); if (success) statusView.text = "Fusion réussie !" }
                  }.start()
              }

              private fun doneUi() { goBtnLayout.isEnabled = true; cancelBtnLayout.isEnabled = false }
              private fun copyHash() { lastHash?.let { getSystemService(ClipboardManager::class.java).setPrimaryClip(ClipData.newPlainText("sha256", it)); toast("Copié !") } }
              private fun size(u: Uri): Long = try { contentResolver.query(u, null, null, null, null)?.use { c -> val i = c.getColumnIndex(OpenableColumns.SIZE); if (c.moveToFirst() && i >= 0 && !c.isNull(i)) c.getLong(i) else 0L } ?: 0L } catch (_: Exception) { 0L }
              private fun fmt(b: Long): String {
                  if (b <= 0) return "0 o"
                  val u = arrayOf("o", "Ko", "Mo", "Go", "To")
                  var v = b.toDouble(); var i = 0
                  while (v >= 1024 && i < u.size - 1) { v /= 1024; i++ }
                  return if (i == 0) "$b o" else String.format(Locale.US, "%.2f %s", v, u[i])
              }
              private fun suggestName(): String {
                  if (names.isEmpty()) return "merged.pkg"
                  val first = names.minOrNull() ?: "merged.pkg"
                  return if (first.lowercase().endsWith(".pkg")) first.substringBeforeLast(".") else first
              }
          }
          EOF

      - name: Préparer la clé de signature permanente
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p app
          if [ -n "$SIGNING_KEY" ]; then
            echo "Décodage de la clé permanente..."
            echo "$SIGNING_KEY" | base64 --decode > app/release.jks
          else
            echo "Erreur : Le secret SIGNING_KEY est introuvable !"
            exit 1
          fi

      - name: Build APK Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          gradle clean assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEYSTORE_PASSWORD}"

      - name: Renommer l'APK v2.1.2
        run: cp app/build/outputs/apk/release/app-release.apk PkgMerger-v2.1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pkg-merger-v2.1.2-apk
          path: PkgMerger-v2.1.2.apk
          if-no-files-found: error
