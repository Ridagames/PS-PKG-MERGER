              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun getResId(name: String): Int {
                  var id = resources.getIdentifier(name, "drawable", packageName)
                  if (id == 0) id = resources.getIdentifier("img_$name", "drawable", packageName)
                  return id
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun createCustomButton(labelText: String, bgHex: String, borderHexStr: String, treeSide: Int, allowDuringProcessing: Boolean = false, onClickAction: () -> Unit): View {
                  val cfg = getThemeConfig(currentTheme)
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(4), 0, dp(4))
                  }

                  if (currentTheme == "FORTNITE" && (treeSide == 1 || treeSide == 3)) {
                      val treeRes = getResId("fn_tree1")
                      if (treeRes != 0) {
                          val treeIv = ImageView(this).apply {
                              setImageResource(treeRes)
                              scaleType = ImageView.ScaleType.FIT_CENTER
                          }
                          val lp = LinearLayout.LayoutParams(dp(54), dp(78)).apply {
                              rightMargin = dp(8)
                          }
                          container.addView(treeIv, lp)
                      }
                  }

                  val buttonContent = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }

                  val normalBg = GradientDrawable().apply {
                      setColor(Color.parseColor(bgHex))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(2), Color.parseColor(borderHexStr))
                  }
                  
                  val pressedBg = GradientDrawable().apply {
                      setColor(Color.parseColor(cfg.pressColor))
                      cornerRadius = dp(6).toFloat()
                      setStroke(dp(3), Color.WHITE)
                  }
                  buttonContent.background = normalBg

                  val tv = TextView(this).apply {
                      text = labelText
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  buttonContent.addView(tv, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT))

                  val buttonLp = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f)
                  container.addView(buttonContent, buttonLp)

                  if (currentTheme == "FORTNITE" && (treeSide == 2 || treeSide == 3)) {
                      val treeRes = getResId("fn_tree2")
                      if (treeRes != 0) {
                          val treeIv = ImageView(this).apply {
                              setImageResource(treeRes)
                              scaleType = ImageView.ScaleType.FIT_CENTER
                          }
                          val lp = LinearLayout.LayoutParams(dp(54), dp(78)).apply {
                              leftMargin = dp(8)
                          }
                          container.addView(treeIv, lp)
                      }
                  }

                  buttonContent.setOnClickListener {
                      if (processing && !allowDuringProcessing) {
                          toast("⚠️ Traitement en cours, veuillez patienter...")
                          return@setOnClickListener
                      }
                      val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      vibrator?.vibrate(VibrationEffect.createOneShot(120, VibrationEffect.DEFAULT_AMPLITUDE))
                      if (currentTheme == "GOW") {
                          playClickSound("gow_click")
                      } else if (currentTheme == "FORTNITE") {
                          playClickSound("fn_click")
                      }
                      onClickAction()
                  }

                  buttonContent.setOnTouchListener { view, event ->
                      if (processing && !allowDuringProcessing) return@setOnTouchListener false
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              view.animate().scaleX(0.96f).scaleY(0.96f).setDuration(60).start()
                              view.background = pressedBg
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              view.animate().scaleX(1.0f).scaleY(1.0f).setDuration(80).start()
                              view.background = normalBg
                          }
                      }
                      false
                  }

                  return container
              }

              private fun playClickSound(soundName: String) {
                  try {
                      var resId = resources.getIdentifier(soundName, "raw", packageName)
                      if (resId == 0) resId = resources.getIdentifier("img_$soundName", "raw", packageName)
                      if (resId != 0) {
                          clickPlayer?.release()
                          clickPlayer = MediaPlayer.create(this, resId)
                          clickPlayer?.start()
                      }
                  } catch (_: Exception) {}
              }

              private fun setupBackgroundMedia() {
                  try {
                      if (musicPlayer != null) {
                          if (!musicPlayer!!.isPlaying) {
                              musicPlayer?.start()
                          }
                          bgVideoView?.start()
                          return
                      }

                      bgVideoView?.stopPlayback()
                      bgVideoView?.visibility = View.GONE
                      
                      stopFortniteBusAnimation()

                      if (currentTheme == "GOW") {
                          bgVideoView?.visibility = View.VISIBLE
                          val videoResId = resources.getIdentifier("gow_bg", "raw", packageName)
                          if (videoResId != 0 && bgVideoView != null) {
                              val uri = Uri.parse("android.resource://$packageName/$videoResId")
                              bgVideoView?.setVideoURI(uri)
                              bgVideoView?.setOnPreparedListener { mp ->
                                  mp.isLooping = true
                                  mp.setVolume(0f, 0f)
                                  bgVideoView?.setVideoSize(mp.videoWidth, mp.videoHeight)
                                  bgVideoView?.start()
                              }
                          }

                          val musicResId = resources.getIdentifier("gow_music", "raw", packageName)
                          if (musicResId != 0) {
                              musicPlayer = MediaPlayer.create(this, musicResId)
                              musicPlayer?.isLooping = true
                              musicPlayer?.start()
                          }
                      } else if (currentTheme == "FORTNITE") {
                          bgVideoView?.visibility = View.VISIBLE
                          val videoResId = resources.getIdentifier("fn_bg", "raw", packageName)
                          if (videoResId != 0 && bgVideoView != null) {
                              val uri = Uri.parse("android.resource://$packageName/$videoResId")
                              bgVideoView?.setVideoURI(uri)
                              bgVideoView?.setOnPreparedListener { mp ->
                                  mp.isLooping = true
                                  mp.setVolume(0f, 0f)
                                  bgVideoView?.setVideoSize(mp.videoWidth, mp.videoHeight)
                                  bgVideoView?.start()
                              }
                          }

                          val fnMusicRes = resources.getIdentifier("fn_music", "raw", packageName)
                          if (fnMusicRes != 0) {
                              musicPlayer = MediaPlayer.create(this, fnMusicRes)
                              musicPlayer?.isLooping = true
                              musicPlayer?.start()
                          }
                          startFortniteBusAnimation()
                      }
                  } catch (_: Exception) {}
              }

              private fun startFortniteBusAnimation() {
                  stopFortniteBusAnimation()
                  busHandler.postDelayed({
                      runFortniteBus()
                  }, 800)
              }

              private fun stopFortniteBusAnimation() {
                  busHandler.removeCallbacksAndMessages(null)
                  busImageView?.visibility = View.GONE
              }

              private fun scheduleNextBusRun() {
                  if (currentTheme != "FORTNITE") return
                  val delay = (5000 + random.nextInt(3500)).toLong()
                  busHandler.postDelayed({
                      runFortniteBus()
                  }, delay)
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun runFortniteBus() {
                  if (currentTheme != "FORTNITE") return
                  val bus = busImageView ?: return
                  val parentWidth = rootFrameLayout.width
                  val screenWidth = if (parentWidth > 0) parentWidth.toFloat() else resources.displayMetrics.widthPixels.toFloat()
                  val rawHeight = rootFrameLayout.height.toFloat()
                  val screenHeight = if (rawHeight > 0f) rawHeight else resources.displayMetrics.heightPixels.toFloat()

                  val goRight = random.nextBoolean()
                  val startX = if (goRight) -dp(240).toFloat() else screenWidth + dp(240).toFloat()
                  val endX = if (goRight) screenWidth + dp(240).toFloat() else -dp(240).toFloat()
                  val randomY = dp(30) + random.nextFloat() * (screenHeight * 0.45f)

                  bus.translationY = randomY
                  bus.translationX = startX
                  bus.scaleX = if (goRight) 1.25f else -1.25f
                  bus.scaleY = 1.25f
                  bus.visibility = View.VISIBLE
                  bus.bringToFront()

                  bus.setOnClickListener {
                      val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      vibrator?.vibrate(VibrationEffect.createOneShot(100, VibrationEffect.DEFAULT_AMPLITUDE))
                      bus.animate().scaleX((if (goRight) 1.4f else -1.4f)).scaleY(1.4f).setDuration(80).withEndAction {
                          bus.animate().scaleX((if (goRight) 1.25f else -1.25f)).scaleY(1.25f).setDuration(80).start()
                      }.start()
                      showInteractivePopup(tr("bus_pop"))
                  }

                  try {
                      var busSoundRes = resources.getIdentifier("fn_bus", "raw", packageName)
                      if (busSoundRes == 0) busSoundRes = resources.getIdentifier("img_fn_bus", "raw", packageName)
                      if (busSoundRes != 0) {
                          fnBusPlayer?.release()
                          fnBusPlayer = MediaPlayer.create(this, busSoundRes)
                          fnBusPlayer?.start()
                      }
                  } catch (_: Exception) {}

                  bus.animate()
                      .translationX(endX)
                      .setDuration(5500)
                      .withEndAction {
                          bus.visibility = View.GONE
                          scheduleNextBusRun()
                      }
                      .start()
              }

              private fun showInteractivePopup(message: String) {
                  val cfg = getThemeConfig(currentTheme)
                  val dialogView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      background = GradientDrawable().apply {
                          setColor(cfg.card)
                          cornerRadius = dp(10).toFloat()
                          setStroke(dp(2), Color.parseColor(cfg.border))
                      }
                  }

                  val tvMsg = TextView(this).apply {
                      text = "💬 $message"
                      textSize = 13f
                      setTextColor(cfg.primaryText)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 0, 0, dp(10))
                  }
                  dialogView.addView(tvMsg)

                  val btnOk = Button(this).apply {
                      text = "OK"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setBackgroundColor(Color.TRANSPARENT)
                  }
                  dialogView.addView(btnOk)

                  val dialog = AlertDialog.Builder(this)
                      .setView(dialogView)
                      .create()
                  dialog.window?.setBackgroundDrawableResource(android.R.color.transparent)
