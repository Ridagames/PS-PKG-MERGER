name: Build Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Réécrire les sources depuis ce workflow"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Nettoyage et Normalisation des Ressources v2.9.19
        run: |
          echo "Nettoyage et correction des extensions de fichiers..."
          for dir in app/src/main/res/drawable app/src/main/res/raw; do
            if [ -d "$dir" ]; then
              for f in "$dir"/*; do
                if [ -f "$f" ]; then
                  filename=$(basename "$f")
                  clean_name=$(echo "$filename" | sed 's/\.png\.png$/\.png/g' | sed 's/\.mp3\.mp3$/\.mp3/g' | sed 's/\.ogg\.ogg$/\.ogg/g')
                  clean_name=$(echo "$clean_name" | tr '[:upper:]' '[:lower:]' | tr '-' '_' | tr -cd 'a-z0-9_.-')
                  if ! echo "$clean_name" | grep -q '^[a-z]'; then
                    clean_name="img_${clean_name}"
                  fi
                  if [ "$filename" != "$clean_name" ]; then
                    mv "$f" "$dir/$clean_name"
                    echo "Corrigé : '$filename' -> '$clean_name'"
                  fi
                fi
              done
            fi
          done

      - name: Générer le projet Android v2.9.19
        env:
          FORCE: '1'
        run: |
          set -e
          mkdir -p app/src/main/java/com/venice/pkgmerger
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw

          write() {
            f="$1"
            echo "  écrit   $f"
            cat > "$f"
          }

          write .gitignore <<'EOF'
          .gradle/
          build/
          local.properties
          *.apk
          *.jks
          *.keystore
          EOF

          write settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PkgMerger"
          include(":app")
          EOF

          write build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          write gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          write app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.venice.pkgmerger"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.venice.pkgmerger"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2919
                  versionName = "2.9.19"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
          }
          EOF

          write app/src/main/res/drawable/ic_app_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#120A0A"
