name: Build PS3 homebrew

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      commit_sources:
        description: "Ecrire les sources generees dans le depot"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ps3-build-${{ github.ref }}
  cancel-in-progress: false

env:
  PS3DEV: /usr/local/ps3dev
  PSL1GHT: /usr/local/ps3dev

jobs:
  build:
    name: Generer et compiler
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest
      options: --user root
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparer la toolchain
        run: |
          set -eo pipefail
          export PSL1GHT="${PSL1GHT:-/usr/local/ps3dev}"
          export PS3DEV="${PS3DEV:-/usr/local/ps3dev}"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"

          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"
          echo "PS3DEV=$PS3DEV"   >> "$GITHUB_ENV"

          command -v ppu-gcc >/dev/null || { echo "::error::ppu-gcc introuvable"; exit 1; }
          echo "Toolchain OK"

      - name: Generer la structure du projet
        run: |
          set -eo pipefail
          rm -rf source assets Makefile *.elf *.self *.pkg pkg_build

          mkdir -p source

          cat << 'MAIN_C' > source/main.c
          #include <stdio.h>
          #include <string.h>
          #include <stdint.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <sys/process.h>
          #include <sysutil/sysutil.h>

          SYS_PROCESS_PARAM(1001, 0x20000)

          #define LV2_SYSCALL_LV2_PEEK 8

          static inline uint64_t lv2_peek(uint64_t addr)
          {
              register uint64_t r3  __asm__("3")  = addr;
              register uint64_t r11 __asm__("11") = LV2_SYSCALL_LV2_PEEK;
              __asm__ volatile("sc"
                  : "+r"(r3)
                  : "r"(r11)
                  : "4","5","6","7","8","9","10","12","memory");
              return r3;
          }

          int main(int argc, char **argv)
          {
              (void)argc; (void)argv;
              printf("PS3 Kernel Reader - Actif !\n");

              uint64_t val = lv2_peek(0x8000000000000000ULL);
              printf("Peek 0x8000... : 0x%016llX\n", (unsigned long long)val);
              fflush(stdout);

              for (;;) {
                  sysUtilCheckCallback();
                  usleep(16000);
              }
              return 0;
          }
          MAIN_C

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > ICON0.PNG
          cp ICON0.PNG PIC1.PNG

      - name: Compiler et empaqueter en vrai .pkg
        run: |
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          set -eo pipefail

          rm -f main.o ps3_kernel_reader.elf ps3_kernel_reader.self ps3_kernel_reader.pkg

          echo "1. Compilation..."
          ppu-gcc -O2 -Wall -I/usr/local/ps3dev/ppu/include -c source/main.c -o main.o
          ppu-gcc -L/usr/local/ps3dev/ppu/lib main.o -lio -lsysutil -llv2 -lm -o ps3_kernel_reader.elf

          echo "2. Nettoyage des symboles..."
          ppu-strip ps3_kernel_reader.elf

          echo "3. Generation SELF..."
          make_self_npdrm ps3_kernel_reader.elf ps3_kernel_reader.self UP0001-KRNLRDR01_00-0000000000000000

          echo "4. Preparation des fichiers..."
          mkdir -p pkg_build/USRDIR
          cp ps3_kernel_reader.self pkg_build/USRDIR/EBOOT.BIN
          cp ICON0.PNG pkg_build/
          cp PIC1.PNG pkg_build/

          echo "5. Generation du PARAM.SFO, telechargement et assemblage en Python..."
          python3 -c '
          import struct, urllib.request, os

          # 1. Generation du PARAM.SFO
          def create_sfo(output_path, title, app_ver, version, title_id):
              entries = [
                  ("TITLE", title.encode("utf-8") + b"\x00", 0x0204, len(title) + 1, 0x80),
                  ("APP_VER", app_ver.encode("utf-8") + b"\x00", 0x0204, len(app_ver) + 1, 8),
                  ("VERSION", version.encode("utf-8") + b"\x00", 0x0204, len(version) + 1, 8),
                  ("TITLE_ID", title_id.encode("utf-8") + b"\x00", 0x0204, len(title_id) + 1, 12),
              ]
              header_size = 20
              index_table_size = len(entries) * 16
              key_table_offset = header_size + index_table_size
              
              key_table = bytearray()
              val_table = bytearray()
              entry_data = []
              
              for key, val, fmt, max_len, _ in entries:
                  key_offset = len(key_table)
                  key_table.extend(key.encode("ascii") + b"\x00")
                  val_offset = len(val_table)
                  val_table.extend(val)
                  entry_data.append((key_offset, fmt, len(val), max_len, val_offset))
                  
              val_table_offset = key_table_offset + len(key_table)
              
              with open(output_path, "wb") as f:
                  f.write(b"\x00PSF")
                  f.write(struct.pack("<I", 0x00010100))
                  f.write(struct.pack("<I", key_table_offset))
                  f.write(struct.pack("<I", val_table_offset))
                  f.write(struct.pack("<I", len(entries)))
                  for key_off, fmt, data_len, max_len, val_off in entry_data:
                      f.write(struct.pack("<HHIHH", key_off, fmt, data_len, max_len, val_table_offset + val_off))
                  f.write(key_table)
                  f.write(val_table)

          create_sfo("pkg_build/PARAM.SFO", "PS3 Kernel Reader", "01.00", "01.00", "KRNLRDR01")

          # 2. Telechargement direct du script de packaging via urllib (evite tout conflit de PATH)
          print("Telechargement du builder de PKG...")
          url = "https://raw.githubusercontent.com/infinitykkj/PS3-PKG-Module/main/pkg_builder.py"
          urllib.request.urlretrieve(url, "pkg_builder.py")
          '

          pip install --quiet pycryptodome || true

          echo "6. Assemblage final du vrai fichier .pkg..."
          python3 pkg_builder.py pkg_build --retail -c "UP0001-KRNLRDR01_00-0000000000000000" -o ps3_kernel_reader.pkg

          # Verification
          if [ -f "ps3_kernel_reader.pkg" ]; then
              echo "Succes : Le vrai .pkg a ete genere avec succes !"
          else
              echo "Erreur : Echec de la creation du .pkg"
              exit 1
          fi

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ps3-kernel-reader
          if-no-files-found: error
          retention-days: 30
          path: |
            ps3_kernel_reader.pkg
            ps3_kernel_reader.self
            ps3_kernel_reader.elf

      - name: Ecrire les sources dans le depot
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.commit_sources) }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "chore: generation automatique du vrai pkg [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
